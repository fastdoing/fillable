t, and then open the print dialog with BOTH the\n      Medicine Proforma and the Detail of Estimate printouts\n      (one per page), regardless of which tab is active on screen.\n   ============================================================ */\nconst BACKUP_WEBAPP_URL = \"https://script.google.com/macros/s/AKfycbyOoi30IAyruVPucHl5VHtdWUzTJdkomOAu4g5Eb5VXOtRYq1TxJvZKyDA9WHx2_3Nw/exec\";\n\nfunction todayFormatted(){\n  const d = new Date();\n  const dd = String(d.getDate()).padStart(2, '0');\n  const mm = String(d.getMonth() + 1).padStart(2, '0');\n  const yyyy = d.getFullYear();\n  return `${dd}/${mm}/${yyyy}`;\n}\n\n/* ============================================================\n   MOBILE NO. HISTORY CHECK (reuse allowed)\n   ------------------------------------------------------------\n   Is browser mein ab tak jitne bhi patients Print/Save kar\n   chuke hain, un sab ke mobile numbers (sirf digits) is list\n   mein mehfooz rehte hain. Agar wohi number dobara diya jaye\n   to Print/Save block NAHI hota \u2014 bas ek popup dikhaya jata\n   hai ke \"yeh number pehlay se list mein hai\", phir Print/Save\n   normally continue ho jata hai.\n   ============================================================ */\nconst USED_MOBILES_KEY = 'pbm_used_mobile_numbers';\n\nfunction getUsedMobiles(){\n  try{\n    const raw = localStorage.getItem(USED_MOBILES_KEY);\n    const arr = raw ? JSON.parse(raw) : [];\n    return Array.isArray(arr) ? arr : [];\n  }catch(err){\n    console.error('Could not read used-mobile list:', err);\n    return [];\n  }\n}\n\nfunction isMobileAlreadyUsed(digitsOnly){\n  return getUsedMobiles().includes(digitsOnly);\n}\n\nfunction markMobileAsUsed(digitsOnly){\n  try{\n    const list = getUsedMobiles();\n    if(!list.includes(digitsOnly)){\n      list.push(digitsOnly);\n      localStorage.setItem(USED_MOBILES_KEY, JSON.stringify(list));\n    }\n  }catch(err){\n    console.error('Could not save used-mobile list:', err);\n  }\n}\n\nasync function backupAndPrint(){\n  const patientName = (document.getElementById('input-patient').value || '').trim();\n  const cnic = (document.getElementById('input-nic').value || '').trim();\n  const address = (document.getElementById('input-address').value || '').trim();\n  const existingDoctorEl = document.getElementById('input-pbm-doctor-name');\n  const existingDoctor = existingDoctorEl ? existingDoctorEl.value : '';\n\n  // ---- Required fields must be filled before Print/Save ----\n  // (Patient Name, Address, CNIC No. go to the Google Sheet backup;\n  // at least one Medicine row must be filled too \u2014 no blank sheet.)\n  const missing = [];\n  if(patientName === '') missing.push('Patient Name');\n  if(address === '') missing.push('Home Address');\n  if(cnic === '') missing.push('CNIC No.');\n  const hasMedicine = items.some(item => (item.brand || '').trim() !== '');\n  if(!hasMedicine) missing.push('at least one Medicine / Item row (Brand Name)');\n\n  if(missing.length > 0){\n    alert('Please fill the following required field(s) before Print/Save:\\n\\n- ' + missing.join('\\n- ') + '\\n\\nPrint/Save cancelled.');\n    return;\n  }\n\n  // ---- Patient Mobile No. is REQUIRED, must be 11-17 digits ----\n  let mobile = '';\n  let mobileDigitsOnly = '';\n  while(true){\n    const input = window.prompt('Patient Mobile No. (required, 11-17 digits):', mobile);\n    if(input === null){\n      alert('Patient Mobile No. is required before Print/Save. Print cancelled.');\n      return;\n    }\n    const cleaned = input.trim();\n    const digitsOnly = cleaned.replace(/[^0-9]/g, '');\n    if(digitsOnly.length < 11 || digitsOnly.length > 17){\n      alert('Invalid Mobile No. \u2014 it must be 11 to 17 digits (you entered ' + digitsOnly.length + '). Please try again.');\n      mobile = cleaned;\n      continue;\n    }\n    // ---- Same Mobile No. is allowed to be reused \u2014 just warn the user ----\n    if(isMobileAlreadyUsed(digitsOnly)){\n      alert('This Mobile No. is already in the list (used before).\\nYeh number pehlay se list mein shamil hai.\\nPrint/Save will continue.');\n    }\n    mobile = cleaned;\n    mobileDigitsOnly = digitsOnly;\n    break;\n  }\n\n  // ---- Dr / Prescriber Name is REQUIRED ----\n  let doctor = existingDoctor ? existingDoctor.trim() : '';\n  while(true){\n    const input = window.prompt('Dr / Prescriber Name (required):', doctor);\n    if(input === null){\n      alert('Dr / Prescriber Name is required before Print/Save. Print cancelled.');\n      return;\n    }\n    const cleaned = input.trim();\n    if(cleaned === ''){\n      alert('Dr / Prescriber Name cannot be blank. Please enter a name.');\n      doctor = '';\n      continue;\n    }\n    doctor = cleaned;\n    break;\n  }\n\n  // NOTE: this Doctor Name is for the Google Sheet backup record ONLY \u2014\n  // same as Mobile No. \u2014 it is intentionally NOT written back into the\n  // \"Doctor Name\" field or the printed Medicine Proforma sheet. If the\n  // user wants the doctor's name to appear on the printout, they should\n  // type it directly into the \"Doctor Name\" field in the editor.\n\n  // ---- Medicine names + total medicine count (is case ki hi) ----\n  const filledItems = items.filter(item => (item.brand || '').trim() !== '');\n  const medicineNames = filledItems.map(item => item.brand.trim()).join(', ');\n  const medicineCount = filledItems.length;\n\n  // ---- Grand Total (Detail of Estimate table ke \"Total Cost\" column ka sum) ----\n  const grandTotal = items.reduce((sum, item) => {\n    const t = parseFloat(item.total);\n    return isNaN(t) ? sum : sum + t;\n  }, 0);\n\n  const payload = {\n    patientName,\n    mobile,\n    cnic,\n    address,\n    date: todayFormatted(),\n    doctor,\n    medicineNames,\n    medicineCount,\n    grandTotal\n  };\n\n  if(BACKUP_WEBAPP_URL && BACKUP_WEBAPP_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT') === -1){\n    try{\n      await fetch(BACKUP_WEBAPP_URL, {\n        method: 'POST',\n        headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n        body: JSON.stringify(payload)\n      });\n    }catch(err){\n      console.error('Google Sheet backup failed:', err);\n      alert('Warning: could not save backup to Google Sheet (check internet connection). Print will continue.');\n    }\n  }else{\n    console.warn('BACKUP_WEBAPP_URL is not configured yet \u2014 skipping Google Sheet backup.');\n  }\n\n  // Is number ko ab \"used\" mark kar do taake dobara koi aur patient\n  // (ya ghalti se yehi patient) isay estemal na kar sake.\n  if(mobileDigitsOnly) markMobileAsUsed(mobileDigitsOnly);\n\n  window.print();\n}\n\n/* ============================================================\n   TAB SWITCHING\n   ============================================================ */\nlet activeTab = 'estimate';\n\nfunction switchTab(tab){\n  activeTab = tab;\n  const isEst = tab === 'estimate';\n\n  document.getElementById('editor-estimate').style.display = isEst ? 'flex' : 'none';\n  document.getElementById('editor-proforma').style.display = isEst ? 'none' : 'flex';\n  document.getElementById('paper-estimate').style.display = isEst ? 'block' : 'none';\n  document.getElementById('paper-proforma').style.display = isEst ? 'none' : 'block';\n\n  document.getElementById('tab-btn-estimate').classList.toggle('active', isEst);\n  document.getElementById('tab-btn-proforma').classList.toggle('active', !isEst);\n\n  // The tab that just became visible now has real widths \u2014 re-run the\n  // 9/10/11 one-line auto-fit so it reflects the correct box width.\n  fitOneLineFields();\n}\n\n/* ============================================================\n   ESTIMATE ITEM TABLE (17 printed rows total)\n   Every row (Sr. 1-17) is a plain free-text medicine slot \u2014\n   Sr. no. is the only fixed column, all other cells (Brand,\n   Potency, Dosage, Company, Unit price, Total Cost) are typed\n   manually. No fixed DETAILS / cost-breakdown rows.\n   ============================================================ */\nconst ROW_COUNT = 17; // all printed rows are now free-text editable slots\n\n// Every editor slot now maps 1:1 to its printed Sr. number (1-17).\nfunction srForSlot(idx){\n  return idx + 1;\n}\n\nfunction defaultItems(){\n  const arr = [];\n  for(let i=0;i<ROW_COUNT;i++){\n    arr.push({ brand:'', potency:'', dosage:'', company:'', unit:'', total:'' });\n  }\n  return arr;\n}\n\nlet items = defaultItems();\n\nfunction buildItemsEditor(){\n  const container = document.getElementById('items-editor');\n  container.innerHTML = '';\n  items.forEach((item, idx) => {\n    const wrap = document.createElement('div');\n    wrap.className = 'border border-slate-200 rounded-xl p-3';\n    wrap.innerHTML = `\n      <div class=\"text-[10px] font-bold text-emerald-700 mb-1.5\">Sr. ${srForSlot(idx)}<\/div>\n      <div class=\"space-y-1.5\">\n        <input type=\"text\" placeholder=\"Brand Name of Drug / Disposable / Implant\" data-idx=\"${idx}\" data-field=\"brand\" value=\"${escapeHtml(item.brand)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n        <div class=\"grid grid-cols-2 gap-1.5\">\n          <input type=\"text\" placeholder=\"Potency\" data-idx=\"${idx}\" data-field=\"potency\" value=\"${escapeHtml(item.potency)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n          <input type=\"text\" placeholder=\"Dosage\" data-idx=\"${idx}\" data-field=\"dosage\" value=\"${escapeHtml(item.dosage)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n        <\/div>\n        <input type=\"text\" placeholder=\"Company Name (Local / Multinational / Imported)\" data-idx=\"${idx}\" data-field=\"company\" value=\"${escapeHtml(item.company)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n        <div class=\"grid grid-cols-2 gap-1.5\">\n          <input type=\"number\" placeholder=\"Unit price\" data-idx=\"${idx}\" data-field=\"unit\" value=\"${escapeHtml(item.unit)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n          <input type=\"number\" placeholder=\"Total Cost\" data-idx=\"${idx}\" data-field=\"total\" value=\"${escapeHtml(item.total)}\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none item-input\">\n        <\/div>\n      <\/div>\n    `;\n    container.appendChild(wrap);\n  });\n\n  container.querySelectorAll('.item-input').forEach(inp => {\n    inp.addEventListener('input', (e) => {\n      const idx = parseInt(e.target.getAttribute('data-idx'));\n      const field = e.target.getAttribute('data-field');\n      items[idx][field] = e.target.value;\n      updatePreview();\n    });\n  });\n}\n\n/* ============================================================\n   CNIC UPLOAD & AUTO-FILL (client-side OCR via Tesseract.js)\n   Images never leave the browser \u2014 Tesseract.js runs fully\n   locally (WASM), only the OCR engine + language data are\n   fetched from a CDN the first time you click \"Scan\".\n   ============================================================ */\n\nconst cnicFiles = { front: null, back: null };\nlet tesseractLoadPromise = null;\n\nfunction loadTesseract(){\n  if(window.Tesseract) return Promise.resolve();\n  if(tesseractLoadPromise) return tesseractLoadPromise;\n  tesseractLoadPromise = new Promise((resolve, reject) => {\n    const s = document.createElement('script');\n    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';\n    s.onload = () => resolve();\n    s.onerror = () => reject(new Error('Could not load OCR engine (check internet connection).'));\n    document.head.appendChild(s);\n  });\n  return tesseractLoadPromise;\n}\n\nfunction handleCnicFile(evt, which){\n  const file = evt.target.files && evt.target.files[0];\n  if(!file) return;\n  cnicFiles[which] = file;\n  const img = document.getElementById('preview-cnic-' + which);\n  const reader = new FileReader();\n  reader.onload = e => {\n    img.src = e.target.result;\n    img.classList.remove('hidden');\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction setCnicStatus(msg){\n  const el = document.getElementById('cnic-status');\n  if(el) el.textContent = msg;\n}\n\nasync function scanCnic(){\n  if(!cnicFiles.front && !cnicFiles.back){\n    setCnicStatus('Please choose the CNIC front and/or back image first.');\n    return;\n  }\n  const btn = document.getElementById('btn-scan-cnic');\n  btn.disabled = true;\n  try{\n    setCnicStatus('Loading OCR engine (English + Urdu)\u2026');\n    await loadTesseract();\n\n    // 'eng+urd' so Urdu script on the CNIC is read correctly instead\n    // of being garbled by an English-only model. Front/back are kept\n    // separate: Name/Gender/DOB/CNIC No. come from the front, Address\n    // is read from the back (that's where NADRA prints it).\n    let frontText = '', backText = '';\n    if(cnicFiles.front){\n      setCnicStatus('Reading front side\u2026');\n      const { data } = await Tesseract.recognize(cnicFiles.front, 'eng+urd');\n      frontText = data.text;\n    }\n    if(cnicFiles.back){\n      setCnicStatus('Reading back side\u2026');\n      const { data } = await Tesseract.recognize(cnicFiles.back, 'eng+urd');\n      backText = data.text;\n    }\n\n    document.getElementById('cnic-raw-text').textContent = (frontText + '\\n' + backText).trim();\n    applyCnicExtraction(frontText, backText);\n    setCnicStatus('Done \u2014 please double-check the auto-filled fields below (OCR/transliteration can misread some characters).');\n  }catch(err){\n    console.error(err);\n    setCnicStatus(err.message || 'Could not scan the CNIC image. Please fill details manually.');\n  }finally{\n    btn.disabled = false;\n  }\n}\n\nfunction hasUrdu(str){\n  return /[\\u0600-\\u06FF]/.test(str);\n}\n\n// Character-level Urdu -> Roman Urdu transliteration (phonetic, not a\n// translation). Runs fully offline. It's approximate \u2014 Urdu is an\n// abjad script so short vowels aren't written \u2014 but it's readable\n// Roman Urdu, matching how it's normally typed in English forms.\nconst URDU_ROMAN_MAP = {\n  '\u0622':'aa','\u0627':'a','\u0628':'b','\u067e':'p','\u062a':'t','\u0679':'t','\u062b':'s','\u062c':'j','\u0686':'ch',\n  '\u062d':'h','\u062e':'kh','\u062f':'d','\u0688':'d','\u0630':'z','\u0631':'r','\u0691':'r','\u0632':'z','\u0698':'zh',\n  '\u0633':'s','\u0634':'sh','\u0635':'s','\u0636':'z','\u0637':'t','\u0638':'z','\u0639':'a','\u063a':'gh','\u0641':'f',\n  '\u0642':'q','\u06a9':'k','\u06af':'g','\u0644':'l','\u0645':'m','\u0646':'n','\u06ba':'n','\u0648':'o','\u06c1':'h',\n  '\u06be':'h','\u0621':\"'\",'\u06cc':'i','\u06d2':'e','\u0626':'y','\u060c':',','\u06d4':'.'\n};\n\nfunction transliterateUrdu(str){\n  return str.split('').map(ch => URDU_ROMAN_MAP[ch] !== undefined ? URDU_ROMAN_MAP[ch] : ch).join('')\n    .replace(/\\s+/g,' ')\n    .trim();\n}\n\nfunction toRomanIfUrdu(str){\n  return hasUrdu(str) ? toTitleCase(transliterateUrdu(str)) : str;\n}\n\n// Line-based parser for Pakistani (bilingual Urdu/English) CNIC\n// front/back layouts. Any Urdu text found is transliterated into\n// Roman Urdu (not translated) before filling the form.\nfunction applyCnicExtraction(frontText, backText){\n  const combinedText = frontText + '\\n' + backText;\n  const frontLines = frontText.split('\\n').map(l => l.trim()).filter(Boolean);\n  const backLines  = backText.split('\\n').map(l => l.trim()).filter(Boolean);\n  const allLines   = frontLines.concat(backLines);\n\n  // CNIC number: 5-7-1 digit pattern (digits are language-independent),\n  // can appear on either side.\n  const nicMatch = combinedText.match(/\\d{5}-?\\d{7}-?\\d{1}/);\n  if(nicMatch){\n    const digits = nicMatch[0].replace(/-/g,'');\n    const formatted = digits.slice(0,5) + '-' + digits.slice(5,12) + '-' + digits.slice(12);\n    setIfEmpty('input-nic', formatted);\n  }\n\n  // Date of Birth (dd-mm-yyyy, dd/mm/yyyy or dd.mm.yyyy), used for age\n  let dob = null;\n  const dobLineIdx = frontLines.findIndex(l => /date of birth|\u062a\u0627\u0631\u06cc\u062e\\s*\u067e\u06cc\u062f\u0627\u0626\u0634/i.test(l));\n  const searchZone = dobLineIdx >= 0 ? frontLines.slice(dobLineIdx, dobLineIdx + 2).join(' ') : frontText;\n  const dobMatch = searchZone.match(/(\\d{2})[\\/\\-.](\\d{2})[\\/\\-.](\\d{4})/);\n  if(dobMatch){\n    dob = new Date(parseInt(dobMatch[3]), parseInt(dobMatch[2]) - 1, parseInt(dobMatch[1]));\n  }\n\n  // Gender \u2014 check English words first, then Urdu (\u0645\u0631\u062f = male, \u0639\u0648\u0631\u062a = female)\n  let gender = '';\n  if(/\\bmale\\b/i.test(frontText) && !/\\bfemale\\b/i.test(frontText)) gender = 'M';\n  else if(/\\bfemale\\b/i.test(frontText)) gender = 'F';\n  else if(/\u0645\u0631\u062f/.test(frontText)) gender = 'M';\n  else if(/\u0639\u0648\u0631\u062a|\u0632\u0646/.test(frontText)) gender = 'F';\n\n  let age = '';\n  if(dob && !isNaN(dob.getTime())){\n    const diff = Date.now() - dob.getTime();\n    age = Math.floor(diff / (1000*60*60*24*365.25));\n  }\n  if(age !== '' || gender){\n    setIfEmpty('input-age-sex', [age, gender].filter(Boolean).join('/'));\n  }\n\n  // Name: line right after a \"Name\" / \"\u0646\u0627\u0645\" label (skip \"Father Name\" / \"\u0648\u0627\u0644\u062f \u06a9\u0627 \u0646\u0627\u0645\")\n  let nameCandidate = '';\n  for(let i=0; i<frontLines.length; i++){\n    const isNameLabel = /^name$/i.test(frontLines[i]) || /\u0646\u0627\u0645/.test(frontLines[i]);\n    const isFatherLabel = /father|\u0648\u0627\u0644\u062f/i.test(frontLines[i]);\n    if(isNameLabel && !isFatherLabel){\n      for(let j=i+1; j<Math.min(i+3, frontLines.length); j++){\n        const cand = frontLines[j];\n        if(/father|\u0648\u0627\u0644\u062f/i.test(cand)) continue;\n        if(cand.replace(/[^A-Za-z\\u0600-\\u06FF]/g,'').length < 2) continue;\n        nameCandidate = cand;\n        break;\n      }\n      if(nameCandidate) break;\n    }\n  }\n  if(nameCandidate){\n    setIfEmpty('input-patient', hasUrdu(nameCandidate) ? toRomanIfUrdu(nameCandidate) : toTitleCase(nameCandidate));\n  }\n\n  // Relation (Father/Husband Name): CNIC front prints one label \u2014\n  // \"Father Name\" / \"\u0648\u0627\u0644\u062f \u06a9\u0627 \u0646\u0627\u0645\" for unmarried/male cardholders, or\n  // \"Husband Name\" / \"\u0634\u0648\u06c1\u0631 \u06a9\u0627 \u0646\u0627\u0645\" once updated after marriage. Whichever\n  // one is present tells us both the relation's name AND its type:\n  // husband present -> W/O, father present -> S/O (male) or D/O (female,\n  // based on the Gender field read above).\n  let relationCandidate = '';\n  let relationIsHusband = false;\n  for(let i=0; i<frontLines.length; i++){\n    const line = frontLines[i];\n    const isHusbandLabel = /husband|\u0634\u0648\u06c1\u0631/i.test(line);\n    const isFatherLabel = /father|\u0648\u0627\u0644\u062f/i.test(line) && !/^name$/i.test(line.replace(/father|\u0648\u0627\u0644\u062f/i,'').trim());\n    if((isHusbandLabel || isFatherLabel) && !/^name$/i.test(line)){\n      for(let j=i+1; j<Math.min(i+3, frontLines.length); j++){\n        const cand = frontLines[j];\n        if(/gender|\u062c\u0646\u0633|country|stay|identity number|date of birth/i.test(cand)) continue;\n        if(cand.replace(/[^A-Za-z\\u0600-\\u06FF]/g,'').length < 2) continue;\n        relationCandidate = cand;\n        relationIsHusband = isHusbandLabel;\n        break;\n      }\n      if(relationCandidate) break;\n    }\n  }\n  if(relationCandidate){\n    const relType = relationIsHusband ? 'W/O' : (gender === 'F' ? 'D/O' : 'S/O');\n    const relTypeEl = document.getElementById('input-relation-type');\n    if(relTypeEl && !document.getElementById('input-relation-name').value.trim()){\n      relTypeEl.value = relType;\n    }\n    setIfEmpty('input-relation-name', hasUrdu(relationCandidate) ? toRomanIfUrdu(relationCandidate) : toTitleCase(relationCandidate));\n  }\n\n  // Address: NADRA prints this on the BACK of the card. Match the\n  // \"Address\" / \"\u067e\u062a\u06c1\" label even when OCR keeps the value on the same\n  // line (e.g. \"Address House No 12, Model Town Lahore\").\n  const addrSourceLines = backLines.length ? backLines : allLines;\n  const addrLabelRe = /^(residential\\s+)?address\\b\\s*[:\\-]?\\s*/i;\n  const addrUrduLabelRe = /^\u067e\u062a\u06c1\\s*[:\\-]?\\s*/;\n  let addrLineIdx = addrSourceLines.findIndex(l => addrLabelRe.test(l) || addrUrduLabelRe.test(l));\n\n  let addrParts = [];\n  if(addrLineIdx >= 0){\n    const firstLine = addrSourceLines[addrLineIdx].replace(addrLabelRe,'').replace(addrUrduLabelRe,'').trim();\n    if(firstLine) addrParts.push(firstLine);\n    const stopWords = /date of birth|date of issue|date of expiry|identity number|gender|signature|\u062a\u0627\u0631\u06cc\u062e|\u062f\u0633\u062a\u062e\u0637/i;\n    for(let i=addrLineIdx+1; i<addrSourceLines.length; i++){\n      if(stopWords.test(addrSourceLines[i])) break;\n      addrParts.push(addrSourceLines[i]);\n      if(addrParts.length >= 4) break;\n    }\n  } else if(backLines.length){\n    // Fallback: no explicit \"Address\" label recognized \u2014 on the back\n    // of a CNIC the address is usually the longest block of text, so\n    // take the longest run of consecutive Urdu/English content lines\n    // that aren't dates or the CNIC number.\n    const isNoise = l => /^\\d{5}-?\\d{7}-?\\d{1}$/.test(l) || /^\\d{2}[\\/\\-.]\\d{2}[\\/\\-.]\\d{4}$/.test(l) || /government|pakistan|national|identity|card|signature|\u062a\u0627\u0631\u06cc\u062e|\u062f\u0633\u062a\u062e\u0637/i.test(l);\n    let best = [], current = [];\n    backLines.forEach(l => {\n      if(isNoise(l) || l.length < 3){\n        if(current.length > best.length) best = current;\n        current = [];\n      } else {\n        current.push(l);\n      }\n    });\n    if(current.length > best.length) best = current;\n    addrParts = best.slice(0, 4);\n  }\n\n  if(addrParts.length){\n    const joined = addrParts.join(' ');\n    setIfEmpty('input-address', hasUrdu(joined) ? toRomanIfUrdu(joined) : addrParts.join(', '));\n  }\n\n  updatePreview();\n}\n\nfunction setIfEmpty(id, val){\n  if(!val) return;\n  const el = document.getElementById(id);\n  if(el && !el.value.trim()) el.value = val;\n}\n\n// Auto-formats CNIC input as 00000-0000000-0 while typing.\nfunction formatCnicInput(el){\n  const cursorAtEnd = (el.selectionStart === el.value.length);\n  let digits = el.value.replace(/\\D/g, '').slice(0, 13);\n  let formatted = digits;\n  if(digits.length > 5 && digits.length <= 12){\n    formatted = digits.slice(0,5) + '-' + digits.slice(5);\n  } else if(digits.length > 12){\n    formatted = digits.slice(0,5) + '-' + digits.slice(5,12) + '-' + digits.slice(12);\n  }\n  el.value = formatted;\n  if(cursorAtEnd){\n    el.selectionStart = el.selectionEnd = el.value.length;\n  }\n}\n\n// ===== Diagnosis auto-suggest & auto-fill (Rheumatology / Autoimmune / Biologic-therapy cases) =====\nconst DIAGNOSIS_TEMPLATES = [\n  {\n    codes: ['RA'],\n    name: 'Rheumatoid Arthritis',\n    detail: 'Patient is a diagnosed case of Rheumatoid Arthritis (RA), presenting with polyarticular joint pain, swelling and early morning stiffness.',\n    lab: 'RA Factor, Anti-CCP, ESR, CRP, X-Ray of affected joints',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['AS'],\n    name: 'Ankylosing Spondylitis',\n    detail: 'Patient is a diagnosed case of Ankylosing Spondylitis (AS), presenting with chronic inflammatory low back pain and stiffness.',\n    lab: 'HLA-B27, ESR, CRP, X-Ray/MRI of Sacroiliac Joints',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['PsA'],\n    name: 'Psoriatic Arthritis',\n    detail: 'Patient is a diagnosed case of Psoriatic Arthritis (PsA), presenting with joint pain/swelling associated with psoriatic skin lesions.',\n    lab: 'ESR, CRP, RA Factor (negative), X-Ray of affected joints',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['CD'],\n    name: \"Crohn's Disease\",\n    detail: \"Patient is a diagnosed case of Crohn's Disease (CD), presenting with recurrent abdominal pain, diarrhea and weight loss.\",\n    lab: 'Colonoscopy with biopsy, CRP, Fecal Calprotectin',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['UC'],\n    name: 'Ulcerative Colitis',\n    detail: 'Patient is a diagnosed case of Ulcerative Colitis (UC), presenting with bloody diarrhea and abdominal cramps.',\n    lab: 'Colonoscopy with biopsy, CRP, Fecal Calprotectin',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['Uveitis'],\n    name: 'Uveitis',\n    detail: 'Patient is a diagnosed case of Uveitis, presenting with eye pain, redness, photophobia and blurred vision.',\n    lab: 'Ophthalmological examination, HLA-B27, relevant inflammatory markers',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['Plaque Psoriasis', 'PsO'],\n    name: 'Plaque Psoriasis',\n    detail: 'Patient is a diagnosed case of Plaque Psoriasis, presenting with well-demarcated erythematous scaly plaques over the body.',\n    lab: 'Skin biopsy (if done), relevant baseline investigations',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['JIA'],\n    name: 'Juvenile Idiopathic Arthritis',\n    detail: 'Patient is a diagnosed case of Juvenile Idiopathic Arthritis (JIA), presenting with joint pain, swelling and stiffness.',\n    lab: 'ESR, CRP, ANA, RA Factor, X-Ray of affected joints',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['SLE'],\n    name: 'Systemic Lupus Erythematosus',\n    detail: 'Patient is a diagnosed case of Systemic Lupus Erythematosus (SLE), presenting with multisystem involvement.',\n    lab: 'ANA, Anti-dsDNA, Complement levels (C3/C4), CBC, Urine R/E',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  },\n  {\n    codes: ['HS'],\n    name: 'Hidradenitis Suppurativa',\n    detail: 'Patient is a diagnosed case of Hidradenitis Suppurativa (HS), presenting with recurrent painful nodules/abscesses in flexural areas.',\n    lab: 'Relevant baseline investigations, wound/pus culture (if applicable)',\n    prognosis: 'Not worked on 1st line therapies. Stable on current advised medicine/Injection.'\n  }\n];\n\nfunction populateDiagnosisDatalist(){\n  const dl = document.getElementById('diagnosis-suggestions');\n  if(!dl) return;\n  dl.innerHTML = DIAGNOSIS_TEMPLATES.map(t =>\n    `<option value=\"${escapeHtml(t.codes[0])} - ${escapeHtml(t.name)}\"><\/option>`\n  ).join('');\n}\n\nfunction findDiagnosisTemplate(rawValue){\n  const val = (rawValue || '').trim().toLowerCase();\n  if(!val) return null;\n  for(const t of DIAGNOSIS_TEMPLATES){\n    const nameMatch = t.name.toLowerCase() === val;\n    const codeMatch = t.codes.some(c => c.toLowerCase() === val);\n    // Handles the \"CODE - Full Name\" format selected from the datalist dropdown.\n    const comboMatch = t.codes.some(c => val === (c.toLowerCase() + ' - ' + t.name.toLowerCase()));\n    if(nameMatch || codeMatch || comboMatch) return t;\n  }\n  return null;\n}\n\n// Auto-fills fields 9-11 (Brief Clinical Detail, Lab/Radiology Reports, Clinical Prognosis)\n// when field 8 (Diagnosis) matches a known autoimmune/rheumatology condition.\n// Only fills fields that are currently empty, so it never overwrites what a user already typed.\nfunction autofillClinicalDetails(diagnosisValue){\n  const template = findDiagnosisTemplate(diagnosisValue);\n  if(!template) return;\n  setIfEmpty('input-pbm-clinical-detail', template.detail);\n  setIfEmpty('input-pbm-lab-reports', template.lab);\n  setIfEmpty('input-pbm-prognosis', template.prognosis);\n  updatePreview();\n}\n\nfunction toTitleCase(str){\n  return str.toLowerCase().replace(/\\b\\w/g, c => c.toUpperCase());\n}\n\nfunction escapeHtml(str){\n  if(str === undefined || str === null) return '';\n  return String(str)\n    .replace(/&/g,'&amp;')\n    .replace(/<\/g,'&lt;')\n    .replace(/>/g,'&gt;')\n    .replace(/\"/g,'&quot;');\n}\n\n// Human-friendly label for the chosen duration, used in the editor's\n// \"Total\" field label, e.g. 3 -> \"3 Month Cost\", 12 -> \"1 Year Cost\".\nfunction durationLabel(count){\n  if(isNaN(count) || count <= 0) return 'Total';\n  if(count % 12 === 0){\n    const years = count / 12;\n    return years === 1 ? '1 Year Cost' : years + ' Year Cost';\n  }\n  return count + ' Month Cost';\n}\n\n// Printed-form label (replaces \"TOTAL DURATION COST=\") for the chosen\n// duration, matching common PBM terminology.\nfunction durationPrintLabel(countRaw){\n  const count = parseFloat(countRaw);\n  if(isNaN(count) || count <= 0) return 'Total duration cost=';\n  switch(count){\n    case 3:  return 'Quarterly cost=';\n    case 6:  return 'Half yearly cost=';\n    case 12: return 'Yearly cost=';\n    case 18: return '18 months cost=';\n    case 24: return 'Two yearly cost=';\n    default: return count + ' months cost=';\n  }\n}\n\nfunction computeDurationTotal(){\n  // Monthly Cost is the source of truth (Duration Cost field mirrors it),\n  // so always multiply the current Monthly Cost by the selected duration.\n  const monthly = computeMonthlyCost();\n  const countRaw = document.getElementById('input-est-duration-count').value;\n  const count = parseFloat(countRaw);\n  const totalEl = document.getElementById('input-est-duration-total');\n  const labelEl = document.getElementById('label-est-duration-total');\n  if(monthly !== '' && !isNaN(monthly) && !isNaN(count)){\n    totalEl.value = (monthly * count).toLocaleString();\n  } else {\n    totalEl.value = '';\n  }\n  if(labelEl) labelEl.textContent = durationLabel(count);\n\n  const pbmLabelEl = document.getElementById('label-pbm-duration');\n  if(pbmLabelEl) pbmLabelEl.textContent = durationPrintLabel(countRaw);\n}\n\n/* ============================================================\n   ONE PACK COST (x Packs/Month) -> auto-fills Monthly Cost +\n   Duration Cost on BOTH the Estimate and the Medicine Proforma.\n   Typing in either \"One Pack Cost\" box (Estimate or Proforma),\n   or in \"Packs/Month\", or in \"# Units (months)\" keeps both\n   forms' cost figures in sync.\n   ============================================================ */\n\n// Monthly Cost = One Pack Cost x Packs/Month (blank Packs/Month = 1,\n// i.e. one pack a month, same as before this field existed).\nfunction computeMonthlyCost(){\n  const pack = parseFloat(document.getElementById('input-est-pack-cost').value);\n  const unitsRaw = document.getElementById('input-est-units-per-month').value;\n  const units = unitsRaw === '' ? 1 : parseFloat(unitsRaw);\n  if(isNaN(pack) || isNaN(units)) return '';\n  return pack * units;\n}\n\nfunction syncPackCost(val){\n  document.getElementById('input-est-pack-cost').value = val;\n  document.getElementById('input-pbm-pack-cost').value = val;\n  applyCostCalculations();\n}\n\n// Keeps \"Packs / Month\" identical whether typed on the Estimate or the\n// Medicine Proforma panel.\nfunction syncUnitsPerMonth(val){\n  document.getElementById('input-est-units-per-month').value = val;\n  document.getElementById('input-pbm-units-per-month').value = val;\n  applyCostCalculations();\n}\n\n// Keeps \"Duration (months)\" identical whether picked on the Estimate or\n// the Medicine Proforma panel.\nfunction syncDurationCount(val){\n  document.getElementById('input-est-duration-count').value = val;\n  document.getElementById('input-pbm-duration-count').value = val;\n  computeDurationTotal();\n  recalcDurationTotals();\n  updatePreview();\n}\n\n// Recomputes Monthly Cost (Estimate + Proforma) whenever Pack Cost\n// or Packs/Month changes, then cascades into the duration totals.\nfunction applyCostCalculations(){\n  const monthly = computeMonthlyCost();\n  const monthlyStr = monthly === '' ? '' : monthly.toLocaleString();\n\n  // Estimate: Monthly Cost row + Duration Cost (per-month) row\n  document.getElementById('input-est-monthly-cost').value = monthlyStr;\n  document.getElementById('input-est-duration-value').value = monthlyStr;\n\n  // Proforma: Monthly Calc + 13(i) Monthly Cost\n  document.getElementById('input-pbm-monthly-cost-calc').value = monthlyStr;\n  document.getElementById('input-pbm-monthly-cost').value = monthlyStr;\n\n  computeDurationTotal();\n  recalcDurationTotals(monthly);\n  updatePreview();\n}\n\n// Recomputes the Proforma's Duration Calc / 13(ii) Total Cost\n// from Monthly Cost x # Units (months), using the Estimate's\n// \"# Units (months)\" field as the shared duration count.\nfunction recalcDurationTotals(monthly){\n  if(monthly === undefined) monthly = computeMonthlyCost();\n  const count = parseFloat(document.getElementById('input-est-duration-count').value);\n  const durationCalcEl = document.getElementById('input-pbm-duration-cost-calc');\n  const totalCostEl    = document.getElementById('input-pbm-total-cost');\n  if(monthly !== '' && !isNaN(monthly) && !isNaN(count)){\n    const total = (monthly * count).toLocaleString();\n    durationCalcEl.value = total;\n    totalCostEl.value = total;\n  } else {\n    durationCalcEl.value = '';\n    totalCostEl.value = '';\n  }\n}\n\n// Formats a number with thousands separators; returns '' for blank/NaN.\nfunction formatMoney(n){\n  if(n === '' || n === null || n === undefined || isNaN(n)) return '';\n  return Number(n).toLocaleString();\n}\n\n// Builds the \"3500x6=21,000/-\" style calculation strings shared by the\n// Estimate table's Sr.4-6 rows and the Medicine Proforma's One Pack\n// Cost / Monthly Cost / Duration Cost lines, so both printouts always\n// show the identical figures and formula.\nfunction buildCostCalcStrings(){\n  const packCost = parseFloat(document.getElementById('input-est-pack-cost').value);\n  const unitsRaw = document.getElementById('input-est-units-per-month').value;\n  const units = unitsRaw === '' ? 1 : parseFloat(unitsRaw);\n  const durationCountRaw = document.getElementById('input-est-duration-count').value;\n  const durationCount = parseFloat(durationCountRaw);\n\n  const monthly = (!isNaN(packCost) && !isNaN(units)) ? packCost * units : '';\n  const durTotal = (monthly !== '' && !isNaN(durationCount)) ? monthly * durationCount : '';\n\n  const packLine = isNaN(packCost) ? '' : formatMoney(packCost);\n  const monthlyLine = (isNaN(packCost) || monthly === '') ? '' : `${formatMoney(packCost)}x${units}=${formatMoney(monthly)}/-`;\n  const durationLine = (monthly === '' || isNaN(durationCount)) ? '' : `${formatMoney(monthly)}x${durationCount}=${formatMoney(durTotal)}/-`;\n\n  return {\n    packCost: isNaN(packCost) ? '' : packCost,\n    monthly,\n    durTotal,\n    durationCount: isNaN(durationCount) ? '' : durationCount,\n    packLine, monthlyLine, durationLine,\n    durationLabel: durationPrintLabel(durationCountRaw)\n  };\n}\n\n// Same \"3500x6=21,000/-\" style calc as buildCostCalcStrings(), but for\n// the Loading Dose / Maintenance Dose blocks, which each have their own\n// independent Pack Cost / Packs-per-Month / Duration inputs (prefix is\n// 'load' or 'maint').\nfunction buildDoseBlockCostStrings(prefix){\n  const packEl = document.getElementById('input-pbm-' + prefix + '-pack-cost');\n  const unitsEl = document.getElementById('input-pbm-' + prefix + '-units-per-month');\n  const durationEl = document.getElementById('input-pbm-' + prefix + '-duration-count');\n  const packCost = packEl ? parseFloat(packEl.value) : NaN;\n  const unitsRaw = unitsEl ? unitsEl.value : '';\n  const units = unitsRaw === '' ? 1 : parseFloat(unitsRaw);\n  const durationCountRaw = durationEl ? durationEl.value : '';\n  const durationCount = parseFloat(durationCountRaw);\n\n  const monthly = (!isNaN(packCost) && !isNaN(units)) ? packCost * units : '';\n  const durTotal = (monthly !== '' && !isNaN(durationCount)) ? monthly * durationCount : '';\n\n  const packLine = isNaN(packCost) ? '' : formatMoney(packCost);\n  const monthlyLine = (isNaN(packCost) || monthly === '') ? '' : `${formatMoney(packCost)}x${units}=${formatMoney(monthly)}/-`;\n  const durationLine = (monthly === '' || isNaN(durationCount)) ? '' : `${formatMoney(monthly)}x${durationCount}=${formatMoney(durTotal)}/-`;\n\n  return {\n    monthly, durTotal,\n    packLine, monthlyLine, durationLine,\n    durationLabel: durationPrintLabel(durationCountRaw)\n  };\n}\n\n// unitOverride/totalOverride let a row show computed figures (e.g. the\n// One Pack Cost / Duration Total) instead of the item's own manually\n// typed Unit price / Total Cost values.\nfunction buildMedicineRow(item, sr, unitOverride, totalOverride){\n  const unitVal  = (unitOverride  !== undefined) ? formatMoney(unitOverride)  : escapeHtml(item.unit);\n  const totalRaw = (totalOverride !== undefined) ? formatMoney(totalOverride) : escapeHtml(item.total);\n  const totalVal = totalRaw === '' ? '' : `${totalRaw}/-`;\n  const tr = document.createElement('tr');\n  tr.innerHTML = `\n    <td class=\"num\">${sr}<\/td>\n    <td class=\"txt\">${escapeHtml(item.brand)}<\/td>\n    <td class=\"num\">${escapeHtml(item.potency)}<\/td>\n    <td class=\"num\">${escapeHtml(item.dosage)}<\/td>\n    <td class=\"txt\">${escapeHtml(item.company)}<\/td>\n    <td class=\"num\">${unitVal}<\/td>\n    <td class=\"num\">${totalVal}<\/td>\n  `;\n  return tr;\n}\n\nfunction buildEstimateTable(){\n  const tbody = document.getElementById('preview-est-table-body');\n  tbody.innerHTML = '';\n  let totalUnit = 0;\n  let totalCost = 0;\n\n  // Sr. 1-17: plain free-text medicine rows \u2014 every cell (except Sr. no.)\n  // is manually fillable, same as before. No auto-computed overrides.\n  for(let idx=0; idx<items.length; idx++){\n    tbody.appendChild(buildMedicineRow(items[idx], srForSlot(idx)));\n    const u = parseFloat(items[idx].unit);\n    const t = parseFloat(items[idx].total);\n    if(!isNaN(u)) totalUnit += u;\n    if(!isNaN(t)) totalCost += t;\n  }\n\n  document.getElementById('preview-est-total-unit').textContent = totalUnit ? totalUnit.toLocaleString() : '';\n  document.getElementById('preview-est-total-cost').textContent = totalCost ? `${totalCost.toLocaleString()}/-` : '';\n}\n\n/* ============================================================\n   FIELD LIST DEFINITIONS\n   Shared fields are written to BOTH printouts.\n   Doc-specific fields are written to their own printout only.\n   ============================================================ */\n\n// [inputId, previewId(s)...]  -- shared fields map to one preview id per document\nconst SHARED_FIELDS = [\n  ['input-hospital',        ['preview-est-hospital', 'preview-pbm-hospital']],\n  ['input-patient',         ['preview-est-patient',  'preview-pbm-patient']],\n  ['input-age-sex',         ['preview-est-age-sex',  'preview-pbm-age-sex']],\n  ['input-nic',             ['preview-est-cnic',     'preview-pbm-nic']],\n  ['input-address',         ['preview-est-address',  'preview-pbm-address']],\n  ['input-indoor-outdoor',  ['preview-est-indoor-outdoor', 'preview-pbm-indoor-outdoor']],\n];\n\nconst ESTIMATE_ONLY_FIELDS = [\n  ['input-est-file-no',       'preview-est-file-no'],\n  ['input-est-date',          'preview-est-date'],\n  ['input-est-file-no-2',     'preview-est-file-no-2'],\n  ['input-est-verified-on',   'preview-est-verified-on'],\n];\n\n// Cost-breakdown inputs are rendered inside the item table itself\n// (Sr. 4-6), not as simple text-fill targets \u2014 see buildEstimateTable().\nconst ESTIMATE_COST_BREAKDOWN_INPUT_IDS = [\n  'input-est-pack-cost',\n  'input-est-units-per-month',\n  'input-est-monthly-cost',\n  'input-est-duration-value',\n  'input-est-duration-count',\n];\n\nconst PROFORMA_ONLY_FIELDS = [\n  ['input-pbm-social',                'preview-pbm-social'],\n  ['input-pbm-ref-no',                'preview-pbm-ref-no'],\n  ['input-pbm-diagnosis',             'preview-pbm-diagnosis'],\n  ['input-pbm-clinical-detail',       'preview-pbm-clinical-detail'],\n  ['input-pbm-lab-reports',           'preview-pbm-lab-reports'],\n  ['input-pbm-prognosis',             'preview-pbm-prognosis'],\n  ['input-pbm-medicine-line',         'preview-pbm-medicine-line'],\n  ['input-pbm-monthly-cost',          'preview-pbm-monthly-cost'],\n  ['input-pbm-total-cost',            'preview-pbm-total-cost'],\n  ['input-pbm-hospital-contribution', 'preview-pbm-hospital-contribution'],\n  ['input-pbm-pbm-assistance',        'preview-pbm-pbm-assistance'],\n  ['input-pbm-previous-assistance',   'preview-pbm-previous-assistance'],\n  ['input-pbm-case-no',               'preview-pbm-case-no'],\n  ['input-pbm-amount',                'preview-pbm-amount'],\n  ['input-pbm-doctor-name',           'preview-pbm-doctor-name'],\n  ['input-pbm-designation',           'preview-pbm-designation'],\n];\n\nfunction setText(id, val){\n  const el = document.getElementById(id);\n  if(!el) return;\n  const v = (val === undefined || val === null) ? '' : val;\n  el.textContent = v;\n  if(String(v).trim() === ''){ el.classList.add('empty'); } else { el.classList.remove('empty'); }\n}\n\n/* ============================================================\n   ONE-LINE AUTO-FIT (points 9, 10, 11)\n   Keeps \"Brief clinical detail\", \"Lab./radiology reports\" and\n   \"Clinical prognosis\" on a single printed line always. Instead of\n   letting long text wrap (which grows the page and can push it onto\n   a 3rd page), the font-size is shrunk down until the text fits the\n   line's available width. Never grows the line, only shrinks it.\n   ============================================================ */\nconst ONE_LINE_FIT_IDS = ['preview-pbm-clinical-detail', 'preview-pbm-lab-reports', 'preview-pbm-prognosis'];\nconst ONE_LINE_FIT_MAX_PX = 12.5;   // matches the form's base text size for this block\nconst ONE_LINE_FIT_MIN_PX = 9.5;    // never shrink past this, even for very long text\nconst ONE_LINE_FIT_STEP_PX = 0.25;\n\nfunction fitOneLineEl(el){\n  if(!el) return;\n  el.style.fontSize = ONE_LINE_FIT_MAX_PX + 'px';\n  if(!el.textContent || !el.textContent.trim()) return;\n  // Skip when the element (or an ancestor tab) is currently hidden \u2014\n  // clientWidth would read 0 and wrongly shrink the text to the floor.\n  if(el.offsetParent === null) return;\n  let size = ONE_LINE_FIT_MAX_PX;\n  while(el.scrollWidth > el.clientWidth && size > ONE_LINE_FIT_MIN_PX){\n    size -= ONE_LINE_FIT_STEP_PX;\n    el.style.fontSize = size + 'px';\n  }\n}\n\nfunction fitOneLineFields(){\n  // When the toggle is ON (default), points 9-11 stay locked at the\n  // same font-size as every other line on the form (12.5px) instead\n  // of shrinking \u2014 text simply wraps like a normal field in that case.\n  const toggleEl = document.getElementById('input-oneline-fit-toggle');\n  const shrinkEnabled = toggleEl ? toggleEl.checked === false : false;\n  if(!shrinkEnabled) return;\n  ONE_LINE_FIT_IDS.forEach(id => fitOneLineEl(document.getElementById(id)));\n}\n\n// Switches points 9-11 between \"same size as other lines\" (default \u2014\n// fixed 12.5px, wraps normally like every other field) and \"auto-shrink\n// to fit on one line\" (never wraps, font shrinks down as needed).\nfunction toggleOneLineFit(){\n  const toggleEl = document.getElementById('input-oneline-fit-toggle');\n  const shrinkEnabled = toggleEl ? toggleEl.checked === false : false;\n  ONE_LINE_FIT_IDS.forEach(id => {\n    const el = document.getElementById(id);\n    if(!el) return;\n    if(shrinkEnabled){\n      el.classList.add('oneline-fit');\n    } else {\n      el.classList.remove('oneline-fit');\n      el.style.fontSize = ONE_LINE_FIT_MAX_PX + 'px';\n    }\n  });\n  fitOneLineFields();\n}\n\n// Re-fit once the browser actually lays the page out for printing \u2014\n// at that point BOTH print sheets become visible at true A4 width\n// (even the tab that wasn't active on screen), so widths are accurate.\nwindow.addEventListener('beforeprint', fitOneLineFields);\nwindow.addEventListener('resize', fitOneLineFields);\n\nfunction updatePreview(){\n  SHARED_FIELDS.forEach(([inputId, previewIds]) => {\n    const inputEl = document.getElementById(inputId);\n    const val = inputEl ? inputEl.value : '';\n    previewIds.forEach(pid => setText(pid, val));\n  });\n\n  // Relation (S/O, D/O, W/O + Father/Husband name) \u2014 shared across both\n  // printouts. Optional: only shown/printed when the \"Include Relation\"\n  // checkbox is ticked; when off, the relation label + blank are hidden\n  // but the patient-name blank line stretches to fill the freed space,\n  // so the writing line itself is never cut short or removed.\n  const relEnableEl = document.getElementById('input-relation-enable');\n  const relEnabled = relEnableEl ? relEnableEl.checked : false;\n  const relTypeEl = document.getElementById('input-relation-type');\n  const relNameEl = document.getElementById('input-relation-name');\n  const relType = relTypeEl ? relTypeEl.value : 'S/O';\n  const relName = relNameEl ? relNameEl.value : '';\n  ['preview-est-relation-type', 'preview-pbm-relation-type'].forEach(id => {\n    const el = document.getElementById(id);\n    if(el){\n      el.style.display = relEnabled ? '' : 'none';\n      el.textContent = relEnabled ? relType : '';\n    }\n  });\n  ['preview-est-relation', 'preview-pbm-relation'].forEach(id => {\n    const el = document.getElementById(id);\n    if(el) el.style.display = relEnabled ? '' : 'none';\n  });\n  if(relEnabled){\n    setText('preview-est-relation', relName);\n    setText('preview-pbm-relation', relName);\n  }\n  // Patient-name blank: fixed width when relation is shown alongside it,\n  // otherwise it expands (flex-1) to fill the whole line.\n  [['preview-est-patient','40%'], ['preview-pbm-patient','50%']].forEach(([id, w]) => {\n    const el = document.getElementById(id);\n    if(!el) return;\n    if(relEnabled){\n      el.classList.remove('flex-1','min-w-0');\n      el.classList.add('shrink-0');\n      el.style.width = w;\n    } else {\n      el.classList.remove('shrink-0');\n      el.classList.add('flex-1','min-w-0');\n      el.style.width = '';\n    }\n  });\n\n  ESTIMATE_ONLY_FIELDS.forEach(([inputId, previewId]) => {\n    const inputEl = document.getElementById(inputId);\n    setText(previewId, inputEl ? inputEl.value : '');\n  });\n\n  PROFORMA_ONLY_FIELDS.forEach(([inputId, previewId]) => {\n    const inputEl = document.getElementById(inputId);\n    setText(previewId, inputEl ? inputEl.value : '');\n  });\n\n  // Points 9, 10 & 11 must stay on a single line no matter how much is\n  // typed \u2014 shrink font-size to fit rather than wrapping/growing the page.\n  fitOneLineFields();\n\n  // Medicine Proforma's \"One Pack Cost= / Monthly Cost= / [Duration] Cost\n  // Total=\" lines mirror the Estimate's calculation exactly, e.g.\n  // \"3500x6=21,000/-\", so both printouts always show the same figures.\n  const regularCalc = buildCostCalcStrings();\n\n  // Loading Dose / Maintenance Dose split \u2014 only active when the\n  // \"Split into Loading + Maintenance Dose\" checkbox is ticked. When on,\n  // the single 3-line block above is hidden and replaced with 3 portions\n  // side by side: Loading (left) | Maintenance (middle) | Combined Total (right).\n  const doseModeEl = document.getElementById('input-pbm-dose-mode-enable');\n  const doseModeEnabled = doseModeEl ? doseModeEl.checked : false;\n  const singleWrap = document.getElementById('print-cost-single');\n  const dualWrap = document.getElementById('print-cost-dual');\n  if(singleWrap) singleWrap.style.display = doseModeEnabled ? 'none' : '';\n  if(dualWrap) dualWrap.style.display = doseModeEnabled ? '' : 'none';\n\n  if(!doseModeEnabled){\n    setText('preview-pbm-pack-cost', regularCalc.packLine);\n    setText('preview-pbm-monthly-cost-calc', regularCalc.monthlyLine);\n    setText('preview-pbm-duration-cost-calc', regularCalc.durationLine);\n    const durationLabelEl = document.getElementById('label-pbm-duration');\n    if(durationLabelEl) durationLabelEl.textContent = regularCalc.durationLabel;\n\n    const costNoteEl = document.getElementById('input-pbm-cost-note');\n    const costNoteVal = costNoteEl ? costNoteEl.value : '';\n    setText('preview-pbm-cost-note', costNoteVal);\n    const rowCostNote = document.getElementById('row-pbm-cost-note');\n    if(rowCostNote) rowCostNote.style.display = costNoteVal.trim() ? '' : 'none';\n  }\n\n  const loadCalc = buildDoseBlockCostStrings('load');\n  const maintCalc = buildDoseBlockCostStrings('maint');\n\n  ['load', 'maint'].forEach(prefix => {\n    const calc = prefix === 'load' ? loadCalc : maintCalc;\n    setText('preview-pbm-' + prefix + '-pack-cost', calc.packLine);\n    setText('preview-pbm-' + prefix + '-monthly-cost-calc', calc.monthlyLine);\n    setText('preview-pbm-' + prefix + '-duration-cost-calc', calc.durationLine);\n    const labelEl = document.getElementById('label-pbm-' + prefix + '-duration');\n    if(labelEl) labelEl.textContent = calc.durationLabel;\n  });\n\n  // Single shared Statement for BOTH Loading + Maintenance dose \u2014 prints in\n  // the blank space below the Combined Total. Fixed max-height + line-clamp\n  // (set in the HTML/CSS above) guarantee this never grows the printed page.\n  const dosesNoteEl = document.getElementById('input-pbm-doses-note');\n  const dosesNoteVal = dosesNoteEl ? dosesNoteEl.value : '';\n  setText('preview-pbm-doses-note', dosesNoteVal);\n  const rowDosesNote = document.getElementById('row-pbm-doses-note');\n  if(rowDosesNote) rowDosesNote.style.display = dosesNoteVal.trim() ? '' : 'none';\n\n  // Combined total (Loading + Maintenance), from the numeric duration totals directly.\n  const loadDurTotal = (loadCalc.durTotal === '' || isNaN(loadCalc.durTotal)) ? 0 : loadCalc.durTotal;\n  const maintDurTotal = (maintCalc.durTotal === '' || isNaN(maintCalc.durTotal)) ? 0 : maintCalc.durTotal;\n  const combinedTotal = loadDurTotal + maintDurTotal;\n\n  const loadTotalInput = document.getElementById('input-pbm-display-load-total');\n  const maintTotalInput = document.getElementById('input-pbm-display-maint-total');\n  const combinedTotalInput = document.getElementById('input-pbm-display-combined-total');\n\n  if(loadTotalInput) loadTotalInput.value = loadDurTotal ? formatMoney(loadDurTotal) + '/-' : '';\n  if(maintTotalInput) maintTotalInput.value = maintDurTotal ? formatMoney(maintDurTotal) + '/-' : '';\n  if(combinedTotalInput) combinedTotalInput.value = combinedTotal ? formatMoney(combinedTotal) + '/-' : '';\n\n  setText('preview-pbm-combined-total', combinedTotal ? formatMoney(combinedTotal) + '/-' : '');\n\n  // When dose mode is enabled, auto-fill Monthly cost, Total cost, and Medical Assistance.\n  if(doseModeEnabled) {\n    const monthlyInput = document.getElementById('input-pbm-monthly-cost');\n    const totalInput = document.getElementById('input-pbm-total-cost');\n    const assistanceInput = document.getElementById('input-pbm-pbm-assistance');\n    const loadMonthly = (loadCalc.monthly === '' || isNaN(loadCalc.monthly)) ? 0 : loadCalc.monthly;\n\n    if(monthlyInput) monthlyInput.value = loadMonthly ? formatMoney(loadMonthly) + '/-' : '';\n    if(totalInput) totalInput.value = combinedTotal ? formatMoney(combinedTotal) + '/-' : '';\n    if(assistanceInput) assistanceInput.value = combinedTotal ? formatMoney(combinedTotal) + '/-' : '';\n\n    setText('preview-pbm-monthly-cost', loadMonthly ? formatMoney(loadMonthly) + '/-' : '');\n    setText('preview-pbm-total-cost', combinedTotal ? formatMoney(combinedTotal) + '/-' : '');\n    setText('preview-pbm-pbm-assistance', combinedTotal ? formatMoney(combinedTotal) + '/-' : '');\n  }\n\n\n  buildEstimateTable();\n}\n\n/* ============================================================\n   LOADING DOSE / MAINTENANCE DOSE TOGGLE\n   Default (off) keeps the single One Pack Cost / Monthly Cost /\n   Duration Cost block exactly as before. When on, that block is\n   replaced by two independent blocks (Loading Dose, Maintenance\n   Dose), each with its own cost figures and its own free-text\n   statement line \u2014 for cases like UC where a loading dose in the\n   first 2-3 months (upadacitinib / adalimumab / tofacitinib, etc.)\n   gives way to a different maintenance dose/frequency.\n   ============================================================ */\nfunction toggleDoseMode(){\n  const enabled = document.getElementById('input-pbm-dose-mode-enable').checked;\n  const fieldsWrap = document.getElementById('pbm-dose-mode-fields');\n  if(fieldsWrap) fieldsWrap.classList.toggle('hidden', !enabled);\n  updatePreview();\n}\n\n/* ============================================================\n   RELATION TOGGLE (optional S/O, D/O, W/O field)\n   ============================================================ */\nfunction toggleRelationEnabled(){\n  const enabled = document.getElementById('input-relation-enable').checked;\n  const relType = document.getElementById('input-relation-type');\n  const relName = document.getElementById('input-relation-name');\n  if(relType) relType.disabled = !enabled;\n  if(relName) relName.disabled = !enabled;\n  const wrap = document.getElementById('relation-fields-wrap');\n  if(wrap) wrap.classList.toggle('opacity-40', !enabled);\n  updatePreview();\n}\n\n/* ============================================================\n   RESET\n   ============================================================ */\nfunction resetAll(){\n  if(!confirm('Reset all fields to blank?')) return;\n\n  SHARED_FIELDS.forEach(([inputId]) => { const el = document.getElementById(inputId); if(el) el.value = ''; });\n  const relEnableReset = document.getElementById('input-relation-enable');\n  if(relEnableReset) relEnableReset.checked = false;\n  const relTypeReset = document.getElementById('input-relation-type');\n  if(relTypeReset) relTypeReset.value = 'S/O';\n  const relNameReset = document.getElementById('input-relation-name');\n  if(relNameReset) relNameReset.value = '';\n  toggleRelationEnabled();\n  ESTIMATE_ONLY_FIELDS.forEach(([inputId]) => { const el = document.getElementById(inputId); if(el) el.value = ''; });\n  ESTIMATE_COST_BREAKDOWN_INPUT_IDS.forEach(inputId => { const el = document.getElementById(inputId); if(el) el.value = ''; });\n  document.getElementById('input-est-duration-total').value = '';\n  const durLabelEl = document.getElementById('label-est-duration-total');\n  if(durLabelEl) durLabelEl.textContent = 'Total';\n  const pbmLabelEl = document.getElementById('label-pbm-duration');\n  if(pbmLabelEl) pbmLabelEl.textContent = 'Total duration cost=';\n  PROFORMA_ONLY_FIELDS.forEach(([inputId]) => { const el = document.getElementById(inputId); if(el) el.value = ''; });\n  const pbmUnitsReset = document.getElementById('input-pbm-units-per-month');\n  if(pbmUnitsReset) pbmUnitsReset.value = '';\n  const pbmDurationReset = document.getElementById('input-pbm-duration-count');\n  if(pbmDurationReset) pbmDurationReset.value = '';\n\n  const costNoteReset = document.getElementById('input-pbm-cost-note');\n  if(costNoteReset) costNoteReset.value = '';\n  const doseModeReset = document.getElementById('input-pbm-dose-mode-enable');\n  if(doseModeReset) doseModeReset.checked = false;\n  ['load','maint'].forEach(prefix => {\n    ['pack-cost','units-per-month','duration-count'].forEach(suffix => {\n      const el = document.getElementById('input-pbm-' + prefix + '-' + suffix);\n      if(el) el.value = '';\n    });\n  });\n  const dosesNoteReset = document.getElementById('input-pbm-doses-note');\n  if(dosesNoteReset) dosesNoteReset.value = '';\n  toggleDoseMode();\n\n  cnicFiles.front = null;\n  cnicFiles.back = null;\n  ['front','back'].forEach(w => {\n    document.getElementById('input-cnic-' + w).value = '';\n    const img = document.getElementById('preview-cnic-' + w);\n    img.src = '';\n    img.classList.add('hidden');\n  });\n  document.getElementById('cnic-raw-text').textContent = '';\n  setCnicStatus('');\n\n  items = defaultItems();\n  buildItemsEditor();\n  updatePreview();\n}\n\n/* ============================================================\n   INIT\n   ============================================================ */\nbuildItemsEditor();\npopulateDiagnosisDatalist();\ntoggleOneLineFit();\nupdatePreview();\nswitchTab('proforma');\n<\/script>\n\n<\/body>\n<\/html>\n"},B:{t:"PBM Urdu Form",h:"<!DOCTYPE html>\n<html lang=\"ur\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\u067e\u0627\u06a9\u0633\u062a\u0627\u0646 \u0628\u06cc\u062a \u0627\u0644\u0645\u0627\u0644 - Medicine Request Form<\/title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n<style>\n  body{ font-family:'Plus Jakarta Sans', sans-serif; }\n  .urdu{ font-family:'Noto Nastaliq Urdu', serif; line-height:2.0; }\n\n  .rx-canvas{\n    width:210mm;\n    min-height:297mm;\n    max-width:100%;\n    box-shadow:0 25px 60px -15px rgba(0,0,0,0.15);\n    background:#ffffff;\n    box-sizing:border-box;\n  }\n  @media (max-width:900px){\n    .rx-canvas{ width:100%; }\n  }\n\n  @media print{\n    html, body{\n      width:210mm !important;\n      height:297mm !important;\n      background:#fff !important;\n      margin:0 !important;\n      padding:0 !important;\n      -webkit-print-color-adjust:exact !important;\n      print-color-adjust:exact !important;\n    }\n    .no-print{ display:none !important; }\n    .print-area{\n      width:210mm !important;\n      max-width:210mm !important;\n      min-height:297mm !important;\n      position:absolute !important;\n      top:0 !important;\n      left:0 !important;\n      margin:0 !important;\n      box-shadow:none !important;\n      border:none !important;\n      box-sizing:border-box !important;\n    }\n    .rx-container{ padding:0 !important; margin:0 !important; display:block !important; }\n    /* NOTE: @page margin is intentionally 0 here \u2014 the canvas itself already\n       reserves its margin via px-9/py-6 padding. Adding a non-zero @page\n       margin on top of a 210mm-wide absolutely-positioned box pushes the\n       right edge of the form past the physical paper edge, cutting content\n       off / spilling it onto a second page. */\n    @page{ size:A4 portrait; margin:0; }\n  }\n\n  .field-line{\n    border-bottom:1.4px solid #111;\n    min-height:1.6em;\n    padding:0 6px;\n    font-weight:normal;\n    white-space:nowrap;\n    overflow:hidden;\n  }\n  .field-line.empty::after{ content:\"\\00a0\"; }\n\n  /* Taller signature space (Pharmacist / MS-AMS): the box grows upward,\n     leaving blank room above the printed line for signature + stamp,\n     while the underline itself stays aligned with the row's other text. */\n  .sig-line{ min-height:5em; }\n\n  table.med-table{ border-collapse:collapse; width:100%; }\n  table.med-table th, table.med-table td{\n    border:1.4px solid #111;\n    padding:5px 8px;\n    font-size:13.5px;\n    vertical-align:middle;\n    line-height:1.4;\n  }\n  table.med-table th{ font-weight:800; text-align:center; letter-spacing:.2px; padding:6px 8px; }\n  table.med-table td.sr{ text-align:center; font-weight:700; width:6%; }\n  table.med-table td.blank{ height:30px; }\n\n  .title-frame{\n    border:2.4px solid #111;\n    border-radius:9999px;\n    padding:5px 38px;\n  }\n\n  .ref-box{\n    border:2px solid #111;\n    border-radius:14px;\n  }\n\n  .shared-badge{\n    font-size:9px;\n    font-weight:700;\n    text-transform:uppercase;\n    letter-spacing:.03em;\n    color:#059669;\n    background:#d1fae5;\n    padding:1px 6px;\n    border-radius:9999px;\n    margin-left:6px;\n  }\n<\/style>\n<\/head>\n<body class=\"bg-slate-50 min-h-screen flex flex-col\">\n\n  <header class=\"bg-slate-900 text-white p-4 shadow-md no-print flex flex-col lg:flex-row justify-between items-center px-6 gap-4 border-b border-slate-800\">\n    <div class=\"flex items-center gap-3\">\n      <div class=\"bg-emerald-600 p-2 rounded-xl text-white shadow-lg\">\n        <i class=\"fa-solid fa-file-medical text-xl\"><\/i>\n      <\/div>\n      <div>\n        <h1 class=\"font-bold text-base tracking-wide text-slate-100\">Pakistan Bait-ul-Maal Form <span class=\"text-[10px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded font-mono ml-1\">A4 PRINT READY<\/span><\/h1>\n        <p class=\"text-[11px] text-slate-400\">Fill on the left \u2014 the Urdu printout on the right updates live.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"flex items-center gap-3\">\n      <button onclick=\"resetAll()\" class=\"bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition\">\n        <i class=\"fa-solid fa-rotate-left mr-1\"><\/i> Reset\n      <\/button>\n      <button onclick=\"printAndSave()\" class=\"bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white px-6 py-2.5 rounded-xl font-extrabold text-sm flex items-center gap-2 transition shadow-md transform hover:scale-[1.02]\">\n        <i class=\"fa-solid fa-print text-base\"><\/i> Print / Save as PDF\n      <\/button>\n    <\/div>\n  <\/header>\n\n  <p class=\"no-print text-[11px] text-amber-700 bg-amber-50 border-b border-amber-200 px-6 py-2\">\n    Note: This uses the free Google web font \"Noto Nastaliq Urdu\" so the Urdu text renders correctly for anyone opening this file with an internet connection \u2014 it does not depend on Jameel Noori Nastaleeq being installed.\n  <\/p>\n\n  <div class=\"flex-1 flex flex-col lg:flex-row w-full max-w-[1400px] mx-auto p-4 md:p-6 gap-6\">\n\n    <!-- LEFT: EDIT PANEL -->\n    <aside class=\"w-full lg:w-[420px] flex flex-col gap-5 no-print shrink-0\">\n\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-user text-emerald-700\"><\/i> Patient Details\n        <\/h2>\n        <div class=\"space-y-3\">\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Patient Name<\/label>\n            <input type=\"text\" id=\"input-patient\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div class=\"grid grid-cols-[85px_1fr] gap-2\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Relation<\/label>\n              <select id=\"input-relation-type\" oninput=\"updatePreview()\" onchange=\"updatePreview()\" class=\"w-full px-1.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                <option value=\"\u0648\u0644\u062f\">\u0648\u0644\u062f (S/O)<\/option>\n                <option value=\"\u0632\u0648\u062c\u06c1\">\u0632\u0648\u062c\u06c1 (W/O)<\/option>\n                <option value=\"\u062f\u062e\u062a\u0631\">\u062f\u062e\u062a\u0631 (D/O)<\/option>\n              <\/select>\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Father / Husband Name<\/label>\n              <input type=\"text\" id=\"input-relation-name\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n          <div class=\"grid grid-cols-2 gap-2\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Age<\/label>\n              <input type=\"text\" id=\"input-age\" oninput=\"updatePreview()\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Address (Sakuna)<\/label>\n              <input type=\"text\" id=\"input-address\" oninput=\"updatePreview()\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Disease / Marz (jo ke ... mein mubtala hai)<\/label>\n            <input type=\"text\" id=\"input-disease\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div class=\"grid grid-cols-3 gap-2\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Ward / Shoba No.<\/label>\n              <input type=\"text\" id=\"input-ward\" oninput=\"updatePreview()\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Bed No.<\/label>\n              <input type=\"text\" id=\"input-bed\" oninput=\"updatePreview()\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Registration No.<\/label>\n              <input type=\"text\" id=\"input-registration\" oninput=\"updatePreview()\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Date (Mordkha)<\/label>\n            <input type=\"text\" id=\"input-date\" oninput=\"updatePreview()\" placeholder=\"DD-MM-YYYY\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-pills text-emerald-700\"><\/i> Medicines (rows 1-8)\n        <\/h2>\n        <p class=\"text-[10px] text-slate-400 mb-3 leading-relaxed\">Each row: name, strength, daily use, quantity.<\/p>\n        <div id=\"med-editor\" class=\"space-y-3\"><\/div>\n      <\/div>\n\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-signature text-emerald-700\"><\/i> Approvals / Signatures\n        <\/h2>\n        <div class=\"space-y-3\">\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Ward Member (Shoba/Ward)<\/label>\n            <input type=\"text\" id=\"input-ward-member\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Pharmacist Name<\/label>\n            <input type=\"text\" id=\"input-pharmacist\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">MS / AMS Name<\/label>\n            <input type=\"text\" id=\"input-ms-ams\" oninput=\"updatePreview()\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-coins text-emerald-700\"><\/i> References (\u062d\u0648\u0627\u0644\u06c1 \u062c\u0627\u062a) box\n        <\/h2>\n        <div class=\"space-y-3\">\n          <div class=\"grid grid-cols-2 gap-2\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Cheque No.<\/label>\n              <input type
