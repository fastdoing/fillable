<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBM Forms</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
#home h1{font-size:24px;text-align:center}
#home p{color:#64748b;text-align:center;font-size:14px}
.cards{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:100%;max-width:720px}
.card{flex:1 1 280px;background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card:hover,.card:active{border-color:#0d9488;transform:translateY(-3px);box-shadow:0 10px 24px rgba(13,148,136,.18)}
.card .ic{font-size:40px;margin-bottom:10px}
.card h2{font-size:19px;margin-bottom:6px}
.card span{font-size:13px;color:#64748b}
.urdu{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;direction:rtl}
#viewer{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0f172a;color:#fff;font-size:14px}
#bar button{background:#0d9488;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
#frame{flex:1;width:100%;border:0;background:#fff}
@media print{#bar{display:none}}
</style>
</head>
<body>
<div id="home">
  <h1>Pakistan Bait-ul-Mal &mdash; PBM Forms</h1>
  <p>Form select karein</p>
  <div class="cards">
    <div class="card" onclick="openForm('A')"><div class="ic">&#128196;</div><h2>PBM Submission Form</h2><span>Estimate &amp; Medicine Proforma</span></div>
    <div class="card" onclick="openForm('B')"><div class="ic">&#128138;</div><h2>PBM Urdu Form</h2><span class="urdu">میڈیسن ریکوئسٹ فارم</span></div>
  </div>
</div>
<div id="viewer">
  <div id="bar"><button onclick="goHome()">&larr; Home</button><b id="ttl"></b></div>
  <iframe id="frame" allow="camera; clipboard-write"></iframe>
</div>
<script>
const FORMS={A:{t:"PBM Submission Form",h:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>PBM Estimate &amp; Medicine Proforma - Editor &amp; Print<\/title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n<style>\n  body{ font-family:'Plus Jakarta Sans', sans-serif; }\n  .form-serif{ font-family:\"Times New Roman\", Georgia, serif; }\n  \n  /* Professional form input styling */\n  input.form-serif, textarea.form-serif {\n    font-family: \"Times New Roman\", Georgia, serif !important;\n    font-size: 13px;\n    letter-spacing: 0.3px;\n    line-height: 1.6;\n  }\n\n  .rx-canvas{\n    width:210mm;\n    min-height:297mm;\n    max-width:100%;\n    box-shadow:0 25px 60px -15px rgba(0,0,0,0.15);\n    background:#fff;\n    box-sizing:border-box;\n  }\n  @media (max-width:900px){\n    .rx-canvas{ width:100%; }\n  }\n\n  @media print{\n    html, body{\n      width:210mm !important;\n      background:#fff !important;\n      margin:0 !important;\n      padding:0 !important;\n      -webkit-print-color-adjust:exact !important;\n      print-color-adjust:exact !important;\n    }\n    .no-print{ display:none !important; }\n    /* Both printouts (Medicine Proforma + Detail of Estimate) are forced\n       visible at print time, regardless of which tab is active on screen,\n       and are stacked one-per-page using a page break between them. */\n    .print-area{\n      display:block !important;\n      width:210mm !important;\n      max-width:210mm !important;\n      position:static !important;\n      margin:0 !important;\n      box-shadow:none !important;\n      border:none !important;\n      box-sizing:border-box !important;\n    }\n    .print-area + .print-area{\n      page-break-before: always;\n      break-before: page;\n    }\n    .rx-container{ padding:0 !important; margin:0 !important; display:block !important; }\n    @page{ size:A4 portrait; margin:10mm; }\n  }\n\n  .field-line{\n    border-bottom:1.2px solid #111;\n    min-height:1.25em;\n    padding:0 4px;\n    font-weight:normal;\n  }\n  .field-line.empty::after{ content:\"\\00a0\"; }\n\n  /* Points 9, 10 & 11 (Brief clinical detail / Lab-radiology reports /\n     Clinical prognosis) must always stay on ONE line and never wrap,\n     however much is typed \u2014 JS shrinks the font-size to fit instead. */\n  .field-line.oneline-fit{\n    white-space:nowrap;\n    overflow:hidden;\n    display:inline-block;\n  }\n\n  table.est-table{ border-collapse:collapse; width:100%; }\n  table.est-table th, table.est-table td{\n    border:1px solid #111;\n    padding:2px 4px;\n    font-size:11px;\n    vertical-align:middle;\n  }\n  table.est-table th{ font-weight:bold; text-align:center; }\n  table.est-table td.num{ text-align:center; }\n  table.est-table td.txt{ text-align:left; }\n\n  /* Document tab switcher */\n  .doc-tab-btn{\n    transition:background .15s ease,color .15s ease;\n  }\n  .doc-tab-btn.active{\n    background:#059669;\n    color:#fff;\n  }\n  .doc-tab-btn:not(.active){\n    background:#334155;\n    color:#cbd5e1;\n  }\n  .doc-tab-btn:not(.active):hover{\n    background:#475569;\n  }\n\n  /* Shared-field badge in editor */\n  .shared-badge{\n    font-size:9px;\n    font-weight:700;\n    text-transform:uppercase;\n    letter-spacing:.03em;\n    color:#059669;\n    background:#d1fae5;\n    padding:1px 6px;\n    border-radius:9999px;\n    margin-left:6px;\n  }\n<\/style>\n<\/head>\n<body class=\"bg-slate-50 min-h-screen flex flex-col\">\n\n  <header class=\"bg-slate-900 text-white p-4 shadow-md no-print flex flex-col lg:flex-row justify-between items-center px-6 gap-4 border-b border-slate-800\">\n    <div class=\"flex items-center gap-3\">\n      <div class=\"bg-emerald-600 p-2 rounded-xl text-white shadow-lg\">\n        <i class=\"fa-solid fa-file-medical text-xl\"><\/i>\n      <\/div>\n      <div>\n        <h1 class=\"font-bold text-base tracking-wide text-slate-100\">PBM Forms <span class=\"text-[10px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded font-mono ml-1\">A4 PRINT READY<\/span><\/h1>\n        <p class=\"text-[11px] text-slate-400\">Fill once \u2014 shared fields autofill both printouts. Each keeps its own print layout.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"flex items-center gap-2 bg-slate-800 rounded-xl p-1\">\n      <button id=\"tab-btn-proforma\" onclick=\"switchTab('proforma')\" class=\"doc-tab-btn active px-4 py-2 rounded-lg font-semibold text-xs flex items-center gap-1.5\">\n        <i class=\"fa-solid fa-notes-medical\"><\/i> Medicine Proforma\n      <\/button>\n      <button id=\"tab-btn-estimate\" onclick=\"switchTab('estimate')\" class=\"doc-tab-btn px-4 py-2 rounded-lg font-semibold text-xs flex items-center gap-1.5\">\n        <i class=\"fa-solid fa-file-invoice\"><\/i> Detail of Estimate\n      <\/button>\n    <\/div>\n\n    <div class=\"flex items-center gap-3\">\n      <button onclick=\"resetAll()\" class=\"bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition\">\n        <i class=\"fa-solid fa-rotate-left mr-1\"><\/i> Reset\n      <\/button>\n      <button onclick=\"backupAndPrint()\" class=\"bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white px-6 py-2.5 rounded-xl font-extrabold text-sm flex items-center gap-2 transition shadow-md transform hover:scale-[1.02]\">\n        <i class=\"fa-solid fa-print text-base\"><\/i> Print / Save as PDF\n      <\/button>\n    <\/div>\n  <\/header>\n  <div class=\"flex-1 flex flex-col lg:flex-row w-full max-w-[1400px] mx-auto p-4 md:p-6 gap-6\">\n\n    <!-- LEFT: EDIT PANEL -->\n    <aside class=\"w-full lg:w-[420px] flex flex-col gap-5 no-print shrink-0\">\n\n      <!-- ============ SHARED FIELDS (used by BOTH printouts) ============ -->\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-hospital text-emerald-700\"><\/i> Hospital <span class=\"shared-badge\">Shared<\/span>\n        <\/h2>\n        <div>\n          <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Hospital Name<\/label>\n          <input type=\"text\" id=\"input-hospital\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n        <\/div>\n      <\/div>\n\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-user text-emerald-700\"><\/i> Patient Details <span class=\"shared-badge\">Shared<\/span>\n        <\/h2>\n        <div class=\"space-y-3\">\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Patient Name<\/label>\n            <input type=\"text\" id=\"input-patient\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div class=\"flex items-center gap-1.5 -mb-1\">\n            <input type=\"checkbox\" id=\"input-relation-enable\" onchange=\"toggleRelationEnabled()\" class=\"w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer\">\n            <label for=\"input-relation-enable\" class=\"text-[9px] font-bold text-slate-500 uppercase cursor-pointer select-none\">Include Relation on Printout<\/label>\n          <\/div>\n          <div class=\"grid grid-cols-[85px_1fr] gap-2 opacity-40\" id=\"relation-fields-wrap\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Relation<\/label>\n              <select id=\"input-relation-type\" disabled oninput=\"updatePreview()\" onchange=\"updatePreview()\" class=\"w-full px-1.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                <option value=\"S/O\">S/O<\/option>\n                <option value=\"D/O\">D/O<\/option>\n                <option value=\"W/O\">W/O<\/option>\n              <\/select>\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Father / Husband Name<\/label>\n              <input type=\"text\" id=\"input-relation-name\" disabled oninput=\"updatePreview()\" value=\"\" placeholder=\"e.g. Muhammad Akram\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n          <div class=\"grid grid-cols-2 gap-2\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Age &amp; Sex<\/label>\n              <input type=\"text\" id=\"input-age-sex\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">CNIC / N.I. Card No.<\/label>\n              <input type=\"text\" id=\"input-nic\" oninput=\"formatCnicInput(this); updatePreview()\" placeholder=\"00000-0000000-0\" maxlength=\"15\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Home Address<\/label>\n            <input type=\"text\" id=\"input-address\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Indoor / Outdoor<\/label>\n            <input type=\"text\" id=\"input-indoor-outdoor\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n        <\/div>\n        <p class=\"text-[10px] text-slate-400 mt-3 leading-relaxed\">These fields fill in automatically on both the Detail of Estimate and the Medicine Proforma printouts.<\/p>\n      <\/div>\n\n      <!-- ============ CNIC UPLOAD & AUTO-FILL ============ -->\n      <div class=\"bg-white p-5 rounded-2xl shadow-sm border-2 border-emerald-200\">\n        <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n          <i class=\"fa-solid fa-id-card text-emerald-700\"><\/i> CNIC Upload <span class=\"shared-badge\">Auto-fill<\/span>\n        <\/h2>\n        <p class=\"text-[10px] text-slate-400 mb-3 leading-relaxed\">Upload the CNIC front &amp; back \u2014 either as two separate images, or a single image containing both sides. It's read locally in your browser (English + Urdu OCR, nothing uploaded to a server); any Urdu text found is written in Roman Urdu (not translated) and placed into Patient Name, Relation (S/O, D/O, W/O + Father/Husband name), Age &amp; Sex, CNIC No. and Address above \u2014 please double-check them before printing, OCR/transliteration is not 100% accurate.<\/p>\n\n        <div class=\"grid grid-cols-2 gap-2 mb-2\">\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">CNIC Front<\/label>\n            <input type=\"file\" accept=\"image/*\" id=\"input-cnic-front\" onchange=\"handleCnicFile(event,'front')\" class=\"w-full text-[10px] file:mr-2 file:py-1.5 file:px-2 file:rounded-lg file:border-0 file:bg-emerald-50 file:text-emerald-700 file:text-[10px] file:font-semibold border border-slate-300 rounded-lg\">\n            <img id=\"preview-cnic-front\" class=\"mt-2 w-full h-24 object-contain rounded-lg border border-slate-200 bg-slate-50 hidden\">\n          <\/div>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">CNIC Back<\/label>\n            <input type=\"file\" accept=\"image/*\" id=\"input-cnic-back\" onchange=\"handleCnicFile(event,'back')\" class=\"w-full text-[10px] file:mr-2 file:py-1.5 file:px-2 file:rounded-lg file:border-0 file:bg-emerald-50 file:text-emerald-700 file:text-[10px] file:font-semibold border border-slate-300 rounded-lg\">\n            <img id=\"preview-cnic-back\" class=\"mt-2 w-full h-24 object-contain rounded-lg border border-slate-200 bg-slate-50 hidden\">\n          <\/div>\n        <\/div>\n\n        <button type=\"button\" onclick=\"scanCnic()\" id=\"btn-scan-cnic\" class=\"w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold text-xs flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed\">\n          <i class=\"fa-solid fa-magnifying-glass\"><\/i> Scan &amp; Autofill Patient Details\n        <\/button>\n        <p id=\"cnic-status\" class=\"text-[10px] text-slate-500 mt-2 leading-relaxed\"><\/p>\n\n        <details class=\"mt-2\">\n          <summary class=\"text-[9px] font-bold text-slate-400 uppercase cursor-pointer\">Raw OCR text (for manual checking)<\/summary>\n          <pre id=\"cnic-raw-text\" class=\"text-[9px] text-slate-500 whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-lg p-2 mt-1 max-h-32 overflow-y-auto\"><\/pre>\n        <\/details>\n      <\/div>\n\n      <!-- ============ ESTIMATE-ONLY FIELDS ============ -->\n      <div id=\"editor-estimate\" class=\"flex flex-col gap-5\">\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-file-lines text-emerald-700\"><\/i> File / Date <span class=\"text-[9px] text-slate-400 normal-case font-normal\">(Estimate only)<\/span>\n          <\/h2>\n          <div class=\"space-y-3\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">File No. (PBM/IFA/MED/...)<\/label>\n              <input type=\"text\" id=\"input-est-file-no\" oninput=\"updatePreview()\" value=\"\" placeholder=\"e.g. 1234\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Date<\/label>\n              <input type=\"text\" id=\"input-est-date\" oninput=\"updatePreview()\" value=\"\" placeholder=\"DD/MM/YYYY\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">5. File No. (body)<\/label>\n              <input type=\"text\" id=\"input-est-file-no-2\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-pills text-emerald-700\"><\/i> Medicine / Item Rows (17)\n          <\/h2>\n          <p class=\"text-[10px] text-slate-400 mb-3 leading-relaxed\">All 17 rows are freely fillable \u2014 Brand, Potency, Dosage, Company, Unit price and Total Cost are typed manually for every row. Sr. no. is the only fixed column. The Total row at the bottom sums whatever Unit price / Total Cost figures you type.<\/p>\n          <div id=\"items-editor\" class=\"space-y-3 max-h-[520px] overflow-y-auto pr-1\"><\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-coins text-emerald-700\"><\/i> Cost Breakdown <span class=\"text-[9px] text-slate-400 normal-case font-normal\">(Medicine Proforma only)<\/span>\n          <\/h2>\n          <p class=\"text-[10px] text-slate-400 mb-3 leading-relaxed\">Printed as One pack cost= / Monthly cost= / [Duration] cost total= lines under 12-15 on the Medicine Proforma. No longer shown on the Detail of Estimate table \u2014 that table is now fully manual.<\/p>\n          <div class=\"grid grid-cols-1 gap-2\">\n            <div class=\"grid grid-cols-2 gap-2\">\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">One Pack Cost<\/label>\n                <input type=\"text\" id=\"input-est-pack-cost\" oninput=\"syncPackCost(this.value)\" value=\"\" placeholder=\"e.g. 15250\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Packs / Month<\/label>\n                <input type=\"text\" id=\"input-est-units-per-month\" oninput=\"syncUnitsPerMonth(this.value)\" value=\"\" placeholder=\"1\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Monthly Cost <span class=\"text-[8px] text-emerald-600 normal-case\">(auto = Pack Cost \u00d7 Packs/Month)<\/span><\/label>\n              <input type=\"text\" id=\"input-est-monthly-cost\" oninput=\"updatePreview()\" value=\"\" placeholder=\"e.g. 15250\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div class=\"grid grid-cols-3 gap-2\">\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration Cost <span class=\"text-[8px] text-emerald-600 normal-case\">(auto)<\/span><\/label>\n                <input type=\"text\" id=\"input-est-duration-value\" oninput=\"updatePreview()\" value=\"\" placeholder=\"15250\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration (months)<\/label>\n                <input type=\"number\" id=\"input-est-duration-count\" oninput=\"syncDurationCount(this.value)\" min=\"1\" step=\"1\" placeholder=\"e.g. 6\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label id=\"label-est-duration-total\" class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Total<\/label>\n                <input type=\"text\" id=\"input-est-duration-total\" readonly value=\"\" placeholder=\"auto\" class=\"w-full px-2 py-1.5 border border-slate-200 bg-slate-50 rounded-lg text-xs text-slate-500 focus:outline-none\">\n              <\/div>\n            <\/div>\n            <p class=\"text-[9px] text-slate-400 leading-relaxed\">Monthly Cost = One Pack Cost \u00d7 Packs/Month (leave Packs/Month blank for 1). Type any Duration in months \u2014 TOTAL DURATION COST= row prints as: Monthly Cost | Duration | Total (auto = Monthly Cost \u00d7 Duration).<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-signature text-emerald-700\"><\/i> Verification\n          <\/h2>\n          <div>\n            <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Checked &amp; verified on (date)<\/label>\n            <input type=\"text\" id=\"input-est-verified-on\" oninput=\"updatePreview()\" value=\"\" placeholder=\"DD/MM/YYYY\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n          <\/div>\n          <p class=\"text-[10px] text-slate-400 mt-3 leading-relaxed\">Signatures / stamps for Pharmacist and Consultant are left blank on the printout for wet-ink signing.<\/p>\n        <\/div>\n\n      <\/div>\n\n      <!-- ============ PROFORMA-ONLY FIELDS ============ -->\n      <div id=\"editor-proforma\" class=\"flex flex-col gap-5\" style=\"display:none\">\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-id-card text-emerald-700\"><\/i> Additional Patient Info <span class=\"text-[9px] text-slate-400 normal-case font-normal\">(Proforma only)<\/span>\n          <\/h2>\n          <div class=\"space-y-3\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">5. Social Status<\/label>\n              <input type=\"text\" id=\"input-pbm-social\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">6. Hospital Ref. No<\/label>\n              <input type=\"text\" id=\"input-pbm-ref-no\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-notes-medical text-emerald-700\"><\/i> Clinical Details (8-11)\n          <\/h2>\n          <div class=\"space-y-3\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">8. Diagnosis<\/label>\n              <input type=\"text\" id=\"input-pbm-diagnosis\" list=\"diagnosis-suggestions\" autocomplete=\"off\" oninput=\"updatePreview(); autofillClinicalDetails(this.value)\" value=\"\" placeholder=\"e.g. RA, AS, CD, UC, Uveitis, Plaque Psoriasis...\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <datalist id=\"diagnosis-suggestions\"><\/datalist>\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">9. Brief Clinical Detail<\/label>\n              <textarea id=\"input-pbm-clinical-detail\" oninput=\"updatePreview()\" rows=\"2\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\"><\/textarea>\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">10. Lab/Radiology Reports<\/label>\n              <input type=\"text\" id=\"input-pbm-lab-reports\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">11. Clinical Prognosis<\/label>\n              <textarea id=\"input-pbm-prognosis\" oninput=\"updatePreview()\" rows=\"2\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\"><\/textarea>\n            <\/div>\n            <div class=\"flex items-center gap-1.5 pt-1 border-t border-slate-100\">\n              <input type=\"checkbox\" id=\"input-oneline-fit-toggle\" checked onchange=\"toggleOneLineFit()\" class=\"w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer\">\n              <label for=\"input-oneline-fit-toggle\" class=\"text-[9px] font-bold text-slate-500 uppercase cursor-pointer select-none\">Points 9-11: keep same size as other lines (default) \u2014 uncheck to auto-shrink long text instead<\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-coins text-emerald-700\"><\/i> Medicine &amp; Cost (12-15)\n          <\/h2>\n          <div class=\"space-y-3\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">12. Medicine / Duration Summary<\/label>\n              <input type=\"text\" id=\"input-pbm-medicine-line\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n\n            <!-- DOSE MODE EDITING SECTION - APPEARS FIRST WHEN ENABLED -->\n            <div id=\"pbm-dose-mode-fields\" class=\"hidden flex flex-col gap-3 pt-1\">\n              <div class=\"p-3 rounded-xl bg-emerald-50 border border-emerald-100\">\n                <h3 class=\"text-[10px] font-bold text-emerald-700 uppercase mb-2\">Loading Dose<\/h3>\n                <div class=\"grid grid-cols-3 gap-2\">\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">One Pack Cost<\/label>\n                    <input type=\"text\" id=\"input-pbm-load-pack-cost\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Packs / Month<\/label>\n                    <input type=\"text\" id=\"input-pbm-load-units-per-month\" oninput=\"updatePreview()\" value=\"\" placeholder=\"1\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration (months)<\/label>\n                    <input type=\"number\" id=\"input-pbm-load-duration-count\" oninput=\"updatePreview()\" min=\"1\" step=\"1\" placeholder=\"e.g. 2\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                <\/div>\n              <\/div>\n\n              <div class=\"p-3 rounded-xl bg-blue-50 border border-blue-100\">\n                <h3 class=\"text-[10px] font-bold text-blue-700 uppercase mb-2\">Maintenance Dose<\/h3>\n                <div class=\"grid grid-cols-3 gap-2\">\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">One Pack Cost<\/label>\n                    <input type=\"text\" id=\"input-pbm-maint-pack-cost\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Packs / Month<\/label>\n                    <input type=\"text\" id=\"input-pbm-maint-units-per-month\" oninput=\"updatePreview()\" value=\"\" placeholder=\"1\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration (months)<\/label>\n                    <input type=\"number\" id=\"input-pbm-maint-duration-count\" oninput=\"updatePreview()\" min=\"1\" step=\"1\" placeholder=\"e.g. 4\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                  <\/div>\n                <\/div>\n              <\/div>\n\n              <!-- Dose Totals Summary (shown inside dose mode fields) -->\n              <div class=\"p-3 rounded-xl bg-blue-50 border border-blue-200\">\n                <h3 class=\"text-[10px] font-bold text-blue-700 uppercase mb-2\">\ud83d\udcb0 Dose Costs Summary<\/h3>\n                <div class=\"grid grid-cols-3 gap-2 text-[11px]\">\n                  <div>\n                    <label class=\"block text-[8px] font-bold text-slate-600 uppercase mb-0.5\">Loading Total<\/label>\n                    <input type=\"text\" id=\"input-pbm-display-load-total\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-blue-300 rounded-lg bg-white font-semibold text-emerald-700 text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\" placeholder=\"Auto-calculated\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[8px] font-bold text-slate-600 uppercase mb-0.5\">Maintenance Total<\/label>\n                    <input type=\"text\" id=\"input-pbm-display-maint-total\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-blue-300 rounded-lg bg-white font-semibold text-emerald-700 text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\" placeholder=\"Auto-calculated\">\n                  <\/div>\n                  <div>\n                    <label class=\"block text-[8px] font-bold text-slate-600 uppercase mb-0.5\">Combined Total<\/label>\n                    <input type=\"text\" id=\"input-pbm-display-combined-total\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-blue-300 rounded-lg bg-white font-bold text-blue-700 text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\" placeholder=\"Auto-calculated\">\n                  <\/div>\n                <\/div>\n              <\/div>\n\n              <!-- Single shared Statement for BOTH Loading + Maintenance dose.\n                   Prints in the blank line under \"Total (Loading + Maintenance)=\"\n                   on the right-hand column, reusing existing blank space so the\n                   printed page size never grows. Kept short (maxlength) and the\n                   print side clamps it to 2 lines so it can never push the\n                   layout onto a 3rd page. -->\n              <div class=\"p-3 rounded-xl bg-slate-50 border border-slate-200\">\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Statement <span class=\"text-[8px] text-slate-400 normal-case\">(optional \u2014 one statement for both doses; prints in the blank space below the Total, max ~120 characters so the page never overflows)<\/span><\/label>\n                <textarea id=\"input-pbm-doses-note\" oninput=\"updatePreview()\" rows=\"2\" maxlength=\"120\" placeholder=\"e.g. Dose to be reviewed and adjusted as per clinical response.\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\"><\/textarea>\n              <\/div>\n            <\/div>\n\n            <!-- DEFAULT COST DETAILS - ALWAYS VISIBLE -->\n            <div class=\"grid grid-cols-3 gap-2\">\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">One Pack Cost<\/label>\n                <input type=\"text\" id=\"input-pbm-pack-cost\" oninput=\"syncPackCost(this.value)\" value=\"\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Packs / Month<\/label>\n                <input type=\"text\" id=\"input-pbm-units-per-month\" oninput=\"syncUnitsPerMonth(this.value)\" value=\"\" placeholder=\"1\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration (months)<\/label>\n                <input type=\"number\" id=\"input-pbm-duration-count\" oninput=\"syncDurationCount(this.value)\" min=\"1\" step=\"1\" placeholder=\"e.g. 6\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n            <\/div>\n            <div class=\"grid grid-cols-2 gap-2\">\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Monthly Calc <span class=\"text-[8px] text-emerald-600 normal-case\">(auto)<\/span><\/label>\n                <input type=\"text\" id=\"input-pbm-monthly-cost-calc\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n              <div>\n                <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Duration Calc <span class=\"text-[8px] text-emerald-600 normal-case\">(auto)<\/span><\/label>\n                <input type=\"text\" id=\"input-pbm-duration-cost-calc\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n              <\/div>\n            <\/div>\n            <p class=\"text-[9px] text-slate-400 leading-relaxed\">Same shared calculation as the Estimate: Monthly Cost = One Pack Cost \u00d7 Packs/Month. Type a Duration to auto-fill 13(i)/13(ii) below.<\/p>\n\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Statement <span class=\"text-[8px] text-slate-400 normal-case\">(optional \u2014 prints right after the cost lines above)<\/span><\/label>\n              <textarea id=\"input-pbm-cost-note\" oninput=\"updatePreview()\" rows=\"2\" maxlength=\"140\" placeholder=\"e.g. Dose to be reviewed and adjusted as per clinical response.\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none\"><\/textarea>\n            <\/div>\n\n            <div class=\"flex items-center gap-1.5 pt-2 mt-1 border-t border-slate-100\">\n              <input type=\"checkbox\" id=\"input-pbm-dose-mode-enable\" onchange=\"toggleDoseMode()\" class=\"w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer\">\n              <label for=\"input-pbm-dose-mode-enable\" class=\"text-[9px] font-bold text-slate-500 uppercase cursor-pointer select-none\">Split into Loading + Maintenance Dose<\/label>\n            <\/div>\n            <p class=\"text-[9px] text-slate-400 leading-relaxed -mt-1\">For cases like UC where dose/cost changes after the first few months (e.g. upadacitinib, adalimumab, tofacitinib loading vs maintenance). When off, the single cost block above prints as usual.<\/p>\n\n\n\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">13(i) Monthly Cost Rs. <span class=\"text-[8px] text-blue-600 normal-case\">(auto-filled, editable)<\/span><\/label>\n              <input type=\"text\" id=\"input-pbm-monthly-cost\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none form-serif\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">13(ii) Total Cost Rs. <span class=\"text-[8px] text-blue-600 normal-case\">(auto-filled, editable)<\/span><\/label>\n              <input type=\"text\" id=\"input-pbm-total-cost\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none form-serif\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">14. Contribution from Hospital Rs.<\/label>\n              <input type=\"text\" id=\"input-pbm-hospital-contribution\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none form-serif\">\n            <\/div>\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">15. Medical Assistance Required from PBM Rs. <span class=\"text-[8px] text-blue-600 normal-case\">(auto-filled with total cost, editable)<\/span><\/label>\n              <input type=\"text\" id=\"input-pbm-pbm-assistance\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none form-serif\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-200\">\n          <h2 class=\"font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2\">\n            <i class=\"fa-solid fa-clock-rotate-left text-emerald-700\"><\/i> Previous Assistance (16)\n          <\/h2>\n          <div class=\"space-y-3\">\n            <div>\n              <label class=\"block text-[9px] font-bold text-slate-500 uppercase mb-0.5\">Previous Assistance from PBM (if any)<\/label>\n              <input type=\"text\" id=\"input-pbm-previous-assistance\" oninput=\"updatePreview()\" value=\"\" class=\"w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n            <\/div>\n            <div class=\"grid grid-cols-2 gap-2\">\n              <div>\n                <label cla
