646 \u0646\u0645\u0628\u0631 <span dir=\"ltr\">061-9200757<\/span><\/p>\n              <p class=\"font-bold\" dir=\"ltr\" style=\"text-align:right\">061-9200233-37 /Ext-2058<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"ref-box w-[255px] p-3 text-[13px] shrink-0\">\n            <p class=\"text-center font-bold text-[15px] mb-2\">\u062d\u0648\u0627\u0644\u06c1 \u062c\u0627\u062a<\/p>\n            <p class=\"mb-2\">\u0686\u06cc\u06a9 \u0627\u0632 \u067e\u0627\u06a9\u0633\u062a\u0627\u0646 \u0628\u06cc\u062a \u0627\u0644\u0645\u0627\u0644 \u0644\u0627\u06c1\u0648\u0631/\u0627\u0633\u0644\u0627\u0645 \u0622\u0628\u0627\u062f<\/p>\n            <div class=\"flex items-baseline gap-1 mb-2\">\n              <span class=\"shrink-0\">\u0686\u06cc\u06a9 \u0646\u0645\u0628\u0631<\/span>\n              <span id=\"pv-cheque-no\" class=\"field-line empty flex-1\"><\/span>\n              <span class=\"shrink-0\">\u0645\u0648\u0631\u062e\u06c1<\/span>\n              <span id=\"pv-cheque-date\" class=\"field-line empty w-16\"><\/span>\n            <\/div>\n            <div class=\"flex items-baseline gap-1 mb-2\">\n              <span class=\"shrink-0\">\u0645\u0646\u0638\u0648\u0631 \u0634\u062f\u06c1 \u0641\u0646\u0688<\/span>\n              <span id=\"pv-approved-fund\" class=\"field-line empty flex-1\"><\/span>\n            <\/div>\n            <div class=\"flex items-baseline gap-1 mb-2\">\n              <span class=\"shrink-0\">\u0633\u0627\u0628\u0642\u06c1 \u062e\u0631\u0686\u06c1<\/span>\n              <span id=\"pv-previous-expense\" class=\"field-line empty flex-1\"><\/span>\n            <\/div>\n            <div class=\"flex items-baseline gap-1 mb-2.5\">\n              <span class=\"shrink-0\">\u06a9\u0644 \u0645\u0648\u062c\u0648\u062f\u06c1 \u0631\u0642\u0645<\/span>\n              <span id=\"pv-total-remaining\" class=\"field-line empty flex-1\"><\/span>\n            <\/div>\n            <div class=\"flex items-baseline gap-1 mb-2\">\n              <span class=\"shrink-0\">\u062f\u0633\u062a\u062e\u0637 \u0627\u062f\u0648\u06cc\u0627\u062a \u0648\u0635\u0648\u0644 \u06a9\u0646\u0646\u062f\u06c1<\/span>\n            <\/div>\n            <div class=\"field-line empty mb-2.5\"><\/div>\n            <div class=\"flex items-baseline gap-1\">\n              <span class=\"shrink-0\">\u0645\u0648\u0628\u0627\u0626\u0644 \u0646\u0645\u0628\u0631<\/span>\n              <span id=\"pv-mobile\" class=\"field-line empty flex-1\"><\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n      <\/div>\n    <\/main>\n\n  <\/div>\n\n<script>\nconst ROW_COUNT = 8;\nlet meds = Array.from({length: ROW_COUNT}, () => ({name:'', strength:'', daily:'', qty:''}));\n\nfunction escapeHtml(s){\n  return (s || '').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n}\n\nfunction buildMedEditor(){\n  const wrap = document.getElementById('med-editor');\n  wrap.innerHTML = '';\n  meds.forEach((m, idx) => {\n    const row = document.createElement('div');\n    row.className = 'border border-slate-200 rounded-lg p-2';\n    row.innerHTML = `\n      <div class=\"text-[10px] font-bold text-emerald-700 mb-1\">Row ${idx+1}<\/div>\n      <div class=\"grid grid-cols-2 gap-1.5 mb-1.5\">\n        <input type=\"text\" placeholder=\"Name of Medicine\" data-idx=\"${idx}\" data-field=\"name\" value=\"${escapeHtml(m.name)}\" class=\"col-span-2 w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none med-input\">\n      <\/div>\n      <div class=\"grid grid-cols-3 gap-1.5\">\n        <input type=\"text\" placeholder=\"Strength\" data-idx=\"${idx}\" data-field=\"strength\" value=\"${escapeHtml(m.strength)}\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none med-input\">\n        <input type=\"text\" placeholder=\"Daily Use\" data-idx=\"${idx}\" data-field=\"daily\" value=\"${escapeHtml(m.daily)}\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none med-input\">\n        <input type=\"text\" placeholder=\"Quantity\" data-idx=\"${idx}\" data-field=\"qty\" value=\"${escapeHtml(m.qty)}\" class=\"w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none med-input\">\n      <\/div>\n    `;\n    wrap.appendChild(row);\n  });\n  wrap.querySelectorAll('.med-input').forEach(el => {\n    el.addEventListener('input', e => {\n      const idx = e.target.getAttribute('data-idx');\n      const field = e.target.getAttribute('data-field');\n      meds[idx][field] = e.target.value;\n      updatePreview();\n    });\n  });\n}\n\nfunction setField(id, val){\n  const el = document.getElementById(id);\n  if(!el) return;\n  el.textContent = val || '';\n  el.classList.toggle('empty', !val);\n  fitFieldLine(el);\n}\n\n/* If the entered text is wider than the fixed space assigned to it on the\n   printout, shrink the font-size (instead of wrapping to a second line or\n   letting the box grow) so it stays on one line inside its original slot. */\nfunction fitFieldLine(el){\n  if(!el) return;\n  el.style.fontSize = '';               // reset to the default size first\n  const clientW = el.clientWidth;\n  if(!clientW) return;\n  let scrollW = el.scrollWidth;\n  if(scrollW <= clientW) return;         // fits already, nothing to do\n\n  const baseSize = parseFloat(getComputedStyle(el).fontSize);\n  const MIN_SIZE = 8;                    // px floor so text stays legible\n  let newSize = Math.max(MIN_SIZE, baseSize * (clientW / scrollW) * 0.96);\n  el.style.fontSize = newSize + 'px';\n\n  // fine-tune in case the font doesn't scale perfectly linearly\n  if(el.scrollWidth > el.clientWidth){\n    newSize = Math.max(MIN_SIZE, newSize * (clientW / el.scrollWidth) * 0.97);\n    el.style.fontSize = newSize + 'px';\n  }\n}\n\nfunction buildMedTable(){\n  const tbody = document.getElementById('pv-med-table');\n  tbody.innerHTML = '';\n  meds.forEach((m, idx) => {\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td class=\"sr\">${idx+1}<\/td>\n      <td class=\"blank\" dir=\"ltr\" style=\"text-align:left\">${escapeHtml(m.name)}<\/td>\n      <td class=\"blank\" dir=\"ltr\" style=\"text-align:center\">${escapeHtml(m.strength)}<\/td>\n      <td class=\"blank\" dir=\"ltr\" style=\"text-align:center\">${escapeHtml(m.daily)}<\/td>\n      <td class=\"blank\" dir=\"ltr\" style=\"text-align:center\">${escapeHtml(m.qty)}<\/td>\n    `;\n    tbody.appendChild(tr);\n  });\n}\n\nconst RELATION_LABELS = { '\u0648\u0644\u062f':'\u0648\u0644\u062f', '\u0632\u0648\u062c\u06c1':'\u0632\u0648\u062c\u06c1', '\u062f\u062e\u062a\u0631':'\u062f\u062e\u062a\u0631' };\n\nfunction updatePreview(){\n  setField('pv-patient', document.getElementById('input-patient').value);\n  const relType = document.getElementById('input-relation-type').value;\n  document.getElementById('pv-relation-label').textContent = RELATION_LABELS[relType] || relType;\n  setField('pv-relation-name', document.getElementById('input-relation-name').value);\n  setField('pv-age', document.getElementById('input-age').value);\n  setField('pv-address', document.getElementById('input-address').value);\n  setField('pv-disease', document.getElementById('input-disease').value);\n  setField('pv-ward', document.getElementById('input-ward').value);\n  setField('pv-bed', document.getElementById('input-bed').value);\n  setField('pv-registration', document.getElementById('input-registration').value);\n  setField('pv-date', document.getElementById('input-date').value);\n\n  setField('pv-ward-member', document.getElementById('input-ward-member').value);\n  setField('pv-pharmacist', document.getElementById('input-pharmacist').value);\n  setField('pv-ms-ams', document.getElementById('input-ms-ams').value);\n\n  setField('pv-cheque-no', document.getElementById('input-cheque-no').value);\n  setField('pv-cheque-date', document.getElementById('input-cheque-date').value);\n  setField('pv-approved-fund', document.getElementById('input-approved-fund').value);\n  setField('pv-previous-expense', document.getElementById('input-previous-expense').value);\n  setField('pv-total-remaining', document.getElementById('input-total-remaining').value);\n  setField('pv-mobile', document.getElementById('input-mobile').value);\n\n  buildMedTable();\n}\n\nfunction resetAll(){\n  if(!confirm('Reset all fields?')) return;\n  document.querySelectorAll('aside input').forEach(el => el.value = '');\n  document.getElementById('input-relation-type').value = '\u0648\u0644\u062f';\n  meds = Array.from({length: ROW_COUNT}, () => ({name:'', strength:'', daily:'', qty:''}));\n  buildMedEditor();\n  updatePreview();\n  savedThisRecord = false;\n  setSaveStatus('Not saved yet.', 'slate');\n}\n\n/* ===== GOOGLE SHEET BACKUP =====\n   1. Create a Google Sheet with header row: Sr | Timestamp | Patient Name | Disease | Medicine Name | Address | Mobile No.\n   2. In that Sheet: Extensions > Apps Script > paste the doPost() code given to you separately.\n   3. Deploy > New deployment > Web app > Execute as \"Me\", Access \"Anyone\" > Deploy > copy the Web app URL.\n   4. Paste that URL below, replacing YOUR_WEB_APP_URL_HERE.\n*/\nconst SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzSEbVxqIbNkeC6gz371Tvzi1D5PkAGEP6ZhdGYrbIEyIsYwoa_21EVS3W44oJXrLFiNA/exec';\n\nlet savedThisRecord = false;\n\nfunction setSaveStatus(msg, color){\n  const el = document.getElementById('save-status');\n  if(!el) return;\n  const colors = { slate:'text-slate-400', green:'text-emerald-600', red:'text-red-600', amber:'text-amber-600' };\n  el.className = 'text-[11px] font-semibold mt-2 ' + (colors[color] || colors.slate);\n  el.textContent = msg;\n}\n\nfunction collectRecord(){\n  const medicineNames = meds.map(m => (m.name || '').trim()).filter(Boolean).join(', ');\n  return {\n    patientName: document.getElementById('input-patient').value.trim(),\n    disease: document.getElementById('input-disease').value.trim(),\n    medicines: medicineNames,\n    address: document.getElementById('input-address').value.trim(),\n    mobile: document.getElementById('input-mobile').value.trim()\n  };\n}\n\nfunction doSave(trigger){\n  if(SHEET_WEBHOOK_URL === 'YOUR_WEB_APP_URL_HERE'){\n    if(trigger === 'button') alert('Google Sheet link abhi set nahi hui. SHEET_WEBHOOK_URL me apna Apps Script Web App URL paste karein.');\n    return;\n  }\n  const rec = collectRecord();\n  if(!rec.patientName || !rec.mobile){\n    if(trigger === 'button') alert('Save karne ke liye Patient Name aur Mobile Number dono zaroori hain.');\n    return;\n  }\n  if(savedThisRecord){\n    if(trigger === 'auto') return;\n    if(!confirm('Ye record pehle hi save ho chuka hai. Naya row bana kar dobara save karein?')) return;\n  }\n  setSaveStatus('Saving...', 'amber');\n  fetch(SHEET_WEBHOOK_URL, { method:'POST', body: JSON.stringify(rec) })\n    .then(r => r.json())\n    .then(res => {\n      savedThisRecord = true;\n      setSaveStatus('Saved \u2713 (Sr# ' + res.sr + ')', 'green');\n    })\n    .catch(() => {\n      setSaveStatus('Save nahi hua \u2014 internet ya Sheet URL check karein.', 'red');\n    });\n}\n\nfunction printAndSave(){\n  const patientName = document.getElementById('input-patient').value.trim();\n  if(!patientName){\n    alert('Print / Save as PDF karne se pehle Patient Name darj karein.');\n    document.getElementById('input-patient').focus();\n    return;\n  }\n\n  const address = document.getElementById('input-address').value.trim();\n  if(!address){\n    alert('Print / Save as PDF karne se pehle Address (Sakuna) darj karein.');\n    document.getElementById('input-address').focus();\n    return;\n  }\n\n  const hasMedicine = meds.some(m => (m.name || '').trim());\n  if(!hasMedicine){\n    alert('Print / Save as PDF karne se pehle kam az kam ek Medicine ka naam darj karein.');\n    const firstMedInput = document.querySelector('.med-input[data-field=\"name\"]');\n    if(firstMedInput) firstMedInput.focus();\n    return;\n  }\n\n  const mobileRaw = document.getElementById('input-mobile').value.trim();\n  const digitsOnly = mobileRaw.replace(/\\D/g, '');\n  if(digitsOnly.length < 11 || digitsOnly.length > 16){\n    alert('Print / Save as PDF karne se pehle Patient ka sahi Mobile Number (11 se 16 digits) darj karein.');\n    document.getElementById('input-mobile').focus();\n    return;\n  }\n  doSave('auto');\n  window.print();\n}\n\nbuildMedEditor();\nupdatePreview();\n<\/script>\n<\/body>\n<\/html>\n"}};
